<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Уралия — админ-панель</title>
<style>
:root{--bg:#0b1416;--panel:#10201f;--panel2:#14292a;--line:#2c4a48;--gold:#e0ad4f;--gold2:#ffe3a1;--teal:#3fd6c8;
--text:#eef3f2;--muted:#9fb7b4;--red:#ff7a6b;--green:#7fe39a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:2px solid var(--gold);background:linear-gradient(#152a2b,#0e1c1d)}
header h1{margin:0;font-size:20px;color:var(--gold2);letter-spacing:.5px}header .sp{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);background:#0e1b1c}
nav button{white-space:nowrap}
main{padding:16px;max-width:1100px;margin:auto}
button,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit}
button:hover{border-color:var(--gold)}button.on,button.primary{background:linear-gradient(#e7b453,#b98326);color:#241400;border-color:var(--gold2);font-weight:600}
button.danger{background:#5a1f1a;border-color:#a8433a}button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:#08110f;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
textarea{min-height:70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.card h2{margin:0 0 10px;font-size:17px;color:var(--gold2)}.card h3{margin:12px 0 6px;font-size:15px;color:var(--teal)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 160px}.row>button{flex:0 0 auto}
.stat{background:var(--panel2);border-radius:12px;padding:10px 12px}.stat b{display:block;font-size:22px;color:var(--gold2)}
.muted{color:var(--muted)}.small{font-size:13px}.ok{color:var(--green)}.bad{color:var(--red)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.slot .pv{height:150px;border-radius:10px;background:#081010 repeating-conic-gradient(#0f1d1d 0 25%,#0b1616 0 50%) 50%/20px 20px;
display:flex;align-items:center;justify-content:center;overflow:hidden}.slot .pv img{max-width:100%;max-height:100%}
.slot .pv .empty{color:var(--muted);font-size:13px;text-align:center;padding:8px}
.prompt{font-size:12px;color:#cfe6e2;background:#081312;border:1px dashed #2c4a48;border-radius:8px;padding:6px 8px;max-height:120px;overflow:auto;white-space:pre-wrap;cursor:copy}
.prompt:hover{border-color:var(--gold)}.size{font-weight:700;color:var(--gold2)}button.copy{background:linear-gradient(#2c6b64,#1b4642);border-color:var(--teal);font-weight:600}
.tag{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;background:#24433f;color:var(--teal)}
.tag.g{background:#3c2f12;color:var(--gold2)}.tag.r{background:#4a1d19;color:var(--red)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#132826;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;display:none;max-width:90%}
.login{max-width:420px;margin:60px auto}.chatlog{max-height:440px;overflow:auto}
.chk{display:flex;gap:10px;align-items:center;padding:4px 0;cursor:pointer}.chk input{width:18px;height:18px}
.msg{padding:6px 0;border-bottom:1px solid #1b3331}.msg .a{color:var(--gold2);font-weight:600}
</style>
</head>
<body>
<header><h1>⛰ Уралия — админ-панель</h1><span class="sp"></span><span id="who" class="muted small"></span>
<button id="logout" style="display:none">Выйти</button></header>
<nav id="nav" style="display:none"></nav>
<main id="main"></main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);const main=$('#main');
const TABS=[['overview','Обзор'],['server','Сервер и APK'],['events','События'],['chat','Чат'],['players','Игроки и модерация'],['ai','ИИ-жители'],['art','Графика'],['shop','Магазин']];
let tab='overview',artSec='heroes',aiSec='director';
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(t,bad){const e=$('#toast');e.textContent=t;e.style.borderColor=bad?'#a8433a':'';e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3500)}
function hdr(extra){return Object.assign({'X-Admin-Token':sessionStorage.getItem('tok')||'','X-Admin-Name':encodeURIComponent(sessionStorage.getItem('who')||'owner')},extra||{})}
async function api(p,m='GET',b,raw){const o={method:m,headers:hdr(raw?{'Content-Type':'application/octet-stream'}:{'Content-Type':'application/json'})};
 if(b!==undefined)o.body=raw?b:JSON.stringify(b);const r=await fetch('/admin/api'+p,o);let d={};try{d=await r.json()}catch(e){}
 if(!r.ok){const msg=(d.detail&&d.detail.message)||d.detail||r.statusText;toast('Ошибка: '+msg,true);if(r.status===403&&String(msg).includes('токен')){logout()}throw new Error(msg)}return d}
async function copyText(t){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true}}catch(e){}
 const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);
 ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}
function logout(){sessionStorage.removeItem('tok');location.reload()}
$('#logout').onclick=logout;
function login(){main.innerHTML=`<div class="card login"><h2>Вход</h2><p class="muted small">Токен — значение URALIA_ADMIN_TOKEN из файла .env на сервере (команда: grep URALIA_ADMIN_TOKEN /opt/uralia/.env).</p>
<div class="row"><input id="tok" type="password" placeholder="Токен администратора"></div><div class="row" style="margin-top:8px"><input id="nm" placeholder="Ваше имя (для журнала)" value="owner"></div>
<div class="row" style="margin-top:10px"><button class="primary" id="go">Войти</button></div></div>`;
 $('#go').onclick=async()=>{sessionStorage.setItem('tok',$('#tok').value.trim());sessionStorage.setItem('who',$('#nm').value.trim()||'owner');
  try{await api('/web/overview');start()}catch(e){sessionStorage.removeItem('tok')}}}
function start(){$('#nav').style.display='flex';$('#logout').style.display='';$('#who').textContent=sessionStorage.getItem('who');renderNav();show(tab)}
function renderNav(){$('#nav').innerHTML=TABS.map(([k,t])=>`<button class="${k===tab?'on':''}" data-t="${k}">${t}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderNav();show(tab)})}
async function show(t){main.innerHTML='<p class="muted">Загрузка…</p>';try{await VIEWS[t]()}catch(e){main.innerHTML+=`<p class="bad">${esc(e.message)}</p>`}}
const fmt=n=>Number(n||0).toLocaleString('ru-RU');const time=s=>s?new Date(s).toLocaleString('ru-RU'):'—';

const VIEWS={
async overview(){const d=await api('/web/overview');
 main.innerHTML=`<div class="card"><h2>Сервер сейчас</h2><div class="grid">
 ${[['Игроков',d.players],['Онлайн (3 мин)',d.online],['Активны за сутки',d.active_day],['ИИ-жителей',d.ai],['Гильдий игроков',d.guilds],['ИИ-гильдий',d.ai_guilds],['Сообщений за час',d.chat_hour]]
  .map(([a,b])=>`<div class="stat">${a}<b>${fmt(b)}</b></div>`).join('')}</div></div>
 <div class="card"><h2>Активные события</h2>${d.events.length?d.events.map(e=>`<div>${esc(e.name)} — ${fmt(e.progress)} / ${fmt(e.goal)} · до ${time(e.ends_at)}</div>`).join(''):'<p class="muted">Нет</p>'}</div>
 <div class="card"><h2>Фоновые задачи</h2><table><tr><th>Задача</th><th>Последний запуск</th><th>Итог</th><th></th></tr>
 ${d.jobs.map(j=>`<tr><td>${j.name}</td><td class="small">${time(j.last_run_at)}</td><td class="small muted">${esc(j.last_status)}</td><td><button data-job="${j.name}">Запустить</button></td></tr>`).join('')}</table></div>`;
 document.querySelectorAll('[data-job]').forEach(b=>b.onclick=async()=>{const r=await api('/social/jobs/'+b.dataset.job+'/run','POST',{});toast(b.dataset.job+': '+JSON.stringify(r.result))})},

async server(){const [rel,mode]=await Promise.all([api('/web/release'),api('/status').catch(()=>({}))]);const r=rel.release;
 main.innerHTML=`<div class="card"><h2>Выпуск APK и окно «Вышло обновление»</h2>
 <div class="row"><label>Версия<input id="rv" value="${esc(r.version)}"></label><label>Мин. версия (ниже — обязательное обновление)<input id="rm" value="${esc(r.min_version)}"></label></div>
 <div class="row" style="margin-top:8px"><label>Заголовок<input id="rt" value="${esc(r.title||'')}"></label><label>Файл APK на сервере<select id="rf">${rel.apks.map(a=>`<option ${a.name===r.file?'selected':''}>${esc(a.name)}</option>`).join('')}<option value="">— внешняя ссылка —</option></select></label></div>
 <label style="display:block;margin-top:8px">Что нового (по строке на пункт)<textarea id="rn">${esc((r.notes||[]).join('\n'))}</textarea></label>
 <label style="display:block;margin-top:8px">Внешняя ссылка вместо файла (необязательно)<input id="ru" value="${esc(r.url||'')}" placeholder="https://..."></label>
 <div class="row" style="margin-top:10px"><button class="primary" id="rsave">Сохранить выпуск</button><a class="btn" href="/download" target="_blank">Страница загрузки</a></div>
 <h3>Загрузить APK на сервер</h3><div class="row"><input type="file" id="apk" accept=".apk"><button id="apkup">Загрузить</button></div><p id="apkst" class="muted small"></p>
 <p class="muted small">Файлы на сервере: ${rel.apks.map(a=>esc(a.name)+' ('+(a.size/1048576).toFixed(0)+' МБ)').join(', ')||'нет'}</p></div>
 <div class="card"><h2>ИИ-жители</h2><p class="muted small">Переключатели ИИ, AI Director, население и расписания — во вкладке «ИИ-жители».</p></div>
 <div class="card"><h2>Платежи</h2><p>Режим: <b>${esc(mode.mode||'?')}</b>. Реальные платежи выключены, пока не подключён провайдер. Каталог, заказы и промокоды — во вкладке «Магазин».</p></div>`;
 $('#rsave').onclick=async()=>{await api('/web/release','POST',{version:$('#rv').value.trim(),min_version:$('#rm').value.trim(),title:$('#rt').value,
  notes:$('#rn').value.split('\n').map(s=>s.trim()).filter(Boolean),url:$('#ru').value.trim()||null,file:$('#rf').value||null});toast('Выпуск сохранён — игроки увидят окно обновления')};
 $('#apkup').onclick=async()=>{const f=$('#apk').files[0];if(!f)return toast('Выберите файл',true);$('#apkst').textContent='Загрузка '+(f.size/1048576).toFixed(0)+' МБ…';
  const name=f.name.replace(/[^A-Za-z0-9._-]/g,'_');await api('/web/apk?name='+encodeURIComponent(name),'POST',f,true);$('#apkst').textContent='Загружено: '+name;toast('APK загружен');show('server')}},

async events(){const d=await api('/web/events');
 main.innerHTML=`<div class="card"><h2>Запустить мировое событие</h2><div class="row"><label>Шаблон<select id="et">${d.templates.map(t=>`<option value="${t.code}">${esc(t.name)} (${t.kind})</option>`).join('')}</select></label>
 <label>Длительность, часов<input id="eh" type="number" value="72"></label><label>Цель сервера (пусто — по шаблону)<input id="eg" type="number" placeholder="${d.templates[0]?.goal||''}"></label></div>
 <p class="muted small" id="edesc"></p><div class="row"><button class="primary" id="estart">Запустить</button></div>
 <h3>События</h3><table>${d.active.map(e=>`<tr><td>${esc(e.name)}</td><td>${fmt(e.progress)} / ${fmt(e.goal)}</td><td class="small">${e.status} · до ${time(e.ends_at)}</td><td>${e.status==='active'?`<button data-fin="${e.id}">Завершить сейчас</button>`:''}</td></tr>`).join('')}</table></div>
 <div class="card"><h2>Рейд-боссы</h2>${d.raids.map(r=>`<div class="row"><span>${r.kind==='world'?'Мировой':'Сезонный'}: ${esc(r.boss||'—')} ${r.hp_max?`(${fmt(r.hp_left)} / ${fmt(r.hp_max)})`:''}</span><button data-raid="${r.kind}">Новый босс сейчас</button></div>`).join('')}
 <p class="muted small">Текущий босс завершится (участники получат награду за участие), сразу появится новый.</p></div>
 <div class="card"><h2>Турнир сейчас</h2><div class="row"><label>Шаблон<select id="tt">${d.tournament_templates.map(t=>`<option value="${t.code}">${esc(t.name)}</option>`).join('')}</select></label><label>Регистрация, часов<input id="th" type="number" value="24"></label><button class="primary" id="tstart">Открыть регистрацию</button></div>
 <p class="muted small">Открытые: ${d.tournaments.map(t=>esc(t.name)+' ('+t.status+')').join(', ')||'нет'}</p></div>
 <div class="card"><h2>Подарок / письмо всем игрокам</h2><div class="row"><label>Заголовок<input id="mt" value="Подарок от хранителей"></label><label>Активны за последние, дней<input id="md" type="number" value="30"></label></div>
 <label style="display:block;margin-top:8px">Текст<textarea id="mb">Спасибо, что играете в Уралию!</textarea></label>
 <div class="row" style="margin-top:8px">${['gold','crystals','summon_essence','nature_essence','friend_tokens','raid_tickets'].map(k=>`<label>${{gold:'Золото',crystals:'Кристаллы',summon_essence:'Эссенция призыва',nature_essence:'Эссенция природы',friend_tokens:'Жетоны дружбы',raid_tickets:'Билеты рейда'}[k]}<input type="number" data-rw="${k}" value="0"></label>`).join('')}</div>
 <div class="row" style="margin-top:10px"><button class="primary" id="msend">Отправить всем</button></div></div>`;
 const tpl={};d.templates.forEach(t=>tpl[t.code]=t);const upd=()=>{$('#edesc').textContent=tpl[$('#et').value]?.desc||'';$('#eg').placeholder=tpl[$('#et').value]?.goal||''};$('#et').onchange=upd;upd();
 $('#estart').onclick=async()=>{await api('/web/events/start','POST',{template:$('#et').value,hours:+$('#eh').value,goal:$('#eg').value?+$('#eg').value:null});toast('Событие запущено');show('events')};
 document.querySelectorAll('[data-fin]').forEach(b=>b.onclick=async()=>{if(!confirm('Завершить событие сейчас? Итог применится к миру.'))return;const r=await api('/web/events/'+b.dataset.fin+'/finish','POST',{});toast('Итог: '+r.outcome);show('events')});
 document.querySelectorAll('[data-raid]').forEach(b=>b.onclick=async()=>{if(!confirm('Заменить босса?'))return;await api('/web/raids/respawn','POST',{kind:b.dataset.raid});toast('Новый босс появился');show('events')});
 $('#tstart').onclick=async()=>{await api('/web/tournaments/create','POST',{template:$('#tt').value,reg_hours:+$('#th').value});toast('Турнир открыт');show('events')};
 $('#msend').onclick=async()=>{const rw={};document.querySelectorAll('[data-rw]').forEach(i=>{if(+i.value>0)rw[i.dataset.rw]=+i.value});
  if(!confirm('Отправить письмо всем активным игрокам?'))return;const r=await api('/web/mail-all','POST',{title:$('#mt').value,body:$('#mb').value,rewards:rw,active_days:+$('#md').value});toast('Отправлено: '+r.recipients)}},

async chat(ch){ch=ch||'global';const d=await api('/web/chat?channel='+encodeURIComponent(ch));
 main.innerHTML=`<div class="card"><h2>Написать от имени администрации</h2><div class="row"><label>Канал<select id="cc"><option value="global">Общий чат</option>${d.guilds.map(g=>`<option value="${g.channel}" ${g.channel===ch?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label></div>
 <div class="row" style="margin-top:8px"><input id="ct" placeholder="Сообщение (появится как «📢 Администрация: …»)" maxlength="380"><button class="primary" id="cs">Отправить</button></div></div>
 <div class="card"><h2>Последние сообщения</h2><div class="chatlog">${d.messages.map(m=>`<div class="msg"><span class="a">${esc(m.author)}</span> ${m.is_ai?'<span class="tag">ИИ</span>':''} ${m.uralia_id?`<span class="muted small">${m.uralia_id}</span>`:''} <span class="muted small">${time(m.at)}</span>
 ${m.hidden?'<span class="tag r">скрыто</span>':`<button class="small" data-hide="${m.id}">Скрыть</button>`}<div>${esc(m.text)}</div></div>`).join('')}</div></div>`;
 $('#cc').onchange=()=>VIEWS.chat($('#cc').value);
 $('#cs').onclick=async()=>{if(!$('#ct').value.trim())return;await api('/web/chat','POST',{channel:$('#cc').value,text:$('#ct').value});toast('Отправлено');VIEWS.chat($('#cc').value)};
 document.querySelectorAll('[data-hide]').forEach(b=>b.onclick=async()=>{await api('/social/messages/'+b.dataset.hide+'/hide','POST',{});VIEWS.chat($('#cc').value)})},

async players(){const [rep,app,fl]=await Promise.all([api('/social/reports'),api('/social/appeals'),api('/social/flags')]);
 main.innerHTML=`<div class="card"><h2>Найти игрока</h2><div class="row"><input id="pid" placeholder="UR-XXXXXXXX"><button class="primary" id="pfind">Найти</button></div><div id="pres"></div></div>
 <div class="card"><h2>Жалобы (${rep.items.length})</h2><table>${rep.items.map(r=>`<tr><td><b>${esc(r.target.nickname)}</b> <span class="muted small">${r.target.uralia_id}</span><div class="small">${esc(r.message?r.message.text:'')}</div></td><td class="small">${esc(r.reason)} от ${esc(r.reporter)}</td>
 <td><button data-rep="${r.id}" data-s="actioned">Принято</button> <button data-rep="${r.id}" data-s="dismissed">Отклонить</button></td></tr>`).join('')||'<tr><td class="muted">Нет открытых жалоб</td></tr>'}</table></div>
 <div class="card"><h2>Апелляции</h2><table>${app.items.filter(a=>a.status==='open').map(a=>`<tr><td><b>${esc(a.player.nickname)}</b><div class="small">${esc(a.sanction?.kind_name)}: ${esc(a.sanction?.reason)}</div><div>${esc(a.text)}</div></td>
 <td><button class="primary" data-ap="${a.id}" data-acc="1">Снять санкцию</button> <button data-ap="${a.id}" data-acc="0">Отклонить</button></td></tr>`).join('')||'<tr><td class="muted">Нет открытых апелляций</td></tr>'}</table></div>
 <div class="card"><h2>Подозрительная активность (античит)</h2><table>${fl.items.map(f=>`<tr><td><b>${esc(f.player.nickname)}</b> <span class="muted small">${f.player.uralia_id}</span></td><td>${esc(f.kind)} ×${f.score}</td><td class="small muted">${esc(JSON.stringify(f.details))}</td>
 <td><button data-fl="${f.id}" data-s="reviewed">Проверено</button> <button data-fl="${f.id}" data-s="dismissed">Ложно</button></td></tr>`).join('')||'<tr><td class="muted">Сигналов нет</td></tr>'}</table></div>`;
 $('#pfind').onclick=()=>findPlayer($('#pid').value.trim());
 document.querySelectorAll('[data-rep]').forEach(b=>b.onclick=async()=>{await api('/social/reports/'+b.dataset.rep,'POST',{status:b.dataset.s});show('players')});
 document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{await api('/social/appeals/'+b.dataset.ap,'POST',{accept:b.dataset.acc==='1',resolution:''});show('players')});
 document.querySelectorAll('[data-fl]').forEach(b=>b.onclick=async()=>{await api('/social/flags/'+b.dataset.fl,'POST',{status:b.dataset.s});show('players')})},

async art(){const d=await api('/web/art');
 main.innerHTML=`<div class="card"><h2>Замена графики</h2><p class="muted small">Каждый элемент графики игры — отдельный слот: где он виден в игре, точный размер, формат и готовый промпт для генератора. Загрузите PNG (или JPEG там, где не нужна прозрачность), затем нажмите «Опубликовать» — игроки получат графику фоновым обновлением, без нового APK. Пустые слоты используют встроенную графику. JPEG отображается в игре с версии 0.7.1, остальное — с 0.6.3 (для кнопок, панелей, меню, рамок, регионов и заголовков боя нужна 0.7.1).</p>
 <div class="row"><input id="afind" placeholder="Поиск по всем группам: название или файл" style="flex:1 1 280px"></div>
 <div class="row"><span>Опубликовано: версия ${d.published_version} · ${time(d.published_at)} ${d.dirty?'<span class="tag g">есть неопубликованные изменения</span>':''}</span><button class="primary" id="apub">Опубликовать для игроков</button></div></div>

async section(box,name,title,note,extra){const d=await api('/ai/settings/'+name);const S=d.settings;
 const inp=(k)=>{const f=d.fields[k],v=S[k];if(f.kind==='bool')return `<label class="chk"><input type="checkbox" data-sk="${k}" ${v?'checked':''}> ${esc(d.names[k]||k)}</label>`;
  if(f.kind==='choice')return `<label class="small">${esc(d.names[k]||k)}<select data-sk="${k}">${f.args.map(o=>`<option value="${o}" ${o===v?'selected':''}>${esc((AI_CHOICE[o]||o))}</option>`).join('')}</select></label>`;
  return `<label class="small">${esc(d.names[k]||k)}<input data-sk="${k}" ${f.kind==='int'?`type="number" min="${f.args[0]}" max="${f.args[1]}"`:''} value="${esc(v)}">${v!==d.defaults[k]?`<span class="muted">по умолчанию ${esc(d.defaults[k])}</span>`:''}</label>`};
 box.innerHTML=`<div class="card"><h2>${title}</h2><p class="small muted">${note}</p>${extra?extra(d):''}<div class="grid">${Object.keys(d.fields).map(inp).join('')}</div>
 <div class="row" style="margin-top:10px"><button class="primary" id="ssave">Сохранить</button><button id="srb">Откатить к предыдущим</button></div></div><div id="sx"></div>`;
 $('#ssave').onclick=async()=>{const ch={};box.querySelectorAll('[data-sk]').forEach(i=>{const k=i.dataset.sk,f=d.fields[k];const v=f.kind==='bool'?i.checked:f.kind==='int'?+i.value:i.value;if(v!==S[k])ch[k]=v});
  if(!Object.keys(ch).length)return toast('Изменений нет');await api('/ai/settings/'+name,'POST',ch);toast('Сохранено');AI[aiSec](box)};
 $('#srb').onclick=async()=>{if(!confirm('Вернуть предыдущую версию настроек?'))return;await api('/ai/settings/'+name+'/rollback','POST',{});toast('Откат выполнен');AI[aiSec](box)};
 return d},

 <p class="small bad">Внешние сервисы получают текст сообщения игрока (ник игрока заменяется на «собеседник») и описание ИИ-персонажа. Включая внешний сервис, укажите это в политике конфиденциальности игры. Бесплатные тарифы могут менять лимиты и использовать данные для обучения.</p>
 <table>${Object.entries(d.providers).map(([k,p])=>`<tr><td><b>${esc(p.name)}</b>${k===d.settings.llm_provider?' <span class="tag g">выбран</span>':''}<div class="small muted">${esc(p.hint)}</div><div class="small muted">Модель по умолчанию: ${esc(p.model)}</div></td>
  <td class="small">${p.key?(d.keys[k]?.configured?`<span class="ok">ключ есть</span> ${esc(d.keys[k].mask)}${d.keys[k].source==='env'?' (из .env)':''}`:'<span class="muted">ключа нет</span>'):'ключ не нужен'}</td>

  <button class="small copy" data-ltest="${k}" style="margin-top:4px">Проверить связь</button><div class="small" data-lres="${k}"></div></td></tr>`).join('')}</table></div>`;
 sx.querySelectorAll('[data-ksave]').forEach(b=>b.onclick=async()=>{const k=b.dataset.ksave,v=sx.querySelector(`[data-key="${k}"]`).value.trim();if(!v)return toast('Вставьте ключ',true);
  await api('/ai/llm/key','POST',{provider:k,key:v});toast('Ключ сохранён на сервере');AI.speech(box)});
 sx.querySelectorAll('[data-kdel]').forEach(b=>b.onclick=async()=>{if(!confirm('Удалить ключ этого поставщика?'))return;await api('/ai/llm/key','POST',{provider:b.dataset.kdel,key:''});toast('Ключ удалён');AI.speech(box)});
 sx.querySelectorAll('[data-ltest]').forEach(b=>b.onclick=async()=>{const k=b.dataset.ltest,out=sx.querySelector(`[data-lres="${k}"]`);out.textContent='Проверяю…';b.disabled=true;
  try{const r=await api('/ai/llm/test','POST',{provider:k});out.innerHTML=r.ok?`<span class="ok">Работает</span> за ${r.latency_ms} мс (${esc(r.model)}): «${esc(r.text)}»`:`<span class="bad">Не работает:</span> ${esc(r.error)}`}finally{b.disabled=false}})},

 <p class="small muted">Амбиции: ${Object.entries(a.ambitions).map(([k,v])=>k+' — '+v.toLowerCase()).join('; ')}. Стили речи архетипа сохраняются как были.</p></div>`;

 <p class="small muted">Выполненные задачи через ${'сутки'} переносятся в историю. Повтор задачи никогда не дублирует награды и действия.</p></div>`;
 $('#aitst').onchange=()=>AI.tasks(box,$('#aitst').value);$('#aitref').onclick=()=>AI.tasks(box,$('#aitst').value);
 box.querySelectorAll('[data-retry]').forEach(b=>b.onclick=async()=>{await api('/ai/tasks/'+b.dataset.retry+'/retry','POST',{});toast('Задача снова в очереди');AI.tasks(box,$('#aitst').value)})},

async activity(box){const d=await api('/ai/activity?limit=100');
 box.innerHTML=`<div class="card"><h2>Что делали ИИ</h2><div class="row"><button id="aiaref">Обновить</button></div><table style="margin-top:8px"><tr><th>Когда</th><th>ИИ</th><th>Действие</th><th>Подробности</th></tr>
 ${d.items.map(a=>`<tr><td class="small">${ago(a.at)}</td><td><b>${esc(a.nickname)}</b> <span class="tag">ИИ</span></td><td class="small">${esc(a.activity)}</td><td class="small muted" style="max-width:420px;overflow:hidden">${esc(JSON.stringify(a.payload||{}))}</td></tr>`).join('')||'<tr><td class="muted">Пока пусто</td></tr>'}</table></div>`;
 $('#aiaref').onclick=()=>AI.activity(box)}
};
async function findPlayer(id){if(!id)return;const d=await api('/social/players/'+encodeURIComponent(id));const c=d.card;
 $('#pres').innerHTML=`<h3>${esc(c.nickname)} ${c.is_ai?'<span class="tag">ИИ</span>':''}</h3><div class="small">${c.uralia_id} · ур. ${c.level} · сила ${fmt(c.power)} · ${esc(c.presence)} ${c.guild?'· гильдия '+esc(c.guild.name):''}</div>
 <div class="small muted">Жалоб на игрока: ${d.reports_against}</div>
 <h3>Санкция</h3><div class="row"><select id="sk"><option value="warning">Предупреждение</option><option value="mute">Мут чата</option><option value="temp_ban">Временная блокировка</option><option value="perm_ban">Бессрочная блокировка</option></select>
 <input id="sm" type="number" placeholder="минут (для мута/временной)"><input id="sr" placeholder="Причина"><button class="danger" id="sgo">Выдать</button></div>
 <h3>Добавить VIP-опыт</h3><div class="row"><input id="vl" type="number" placeholder="VIP1 = 100, VIP3 = 1500, VIP5 = 10000, VIP7 = 60000"><button id="vgo">Добавить</button></div>
 <h3>История санкций</h3>${d.sanctions.map(s=>`<div class="small">${esc(s.kind_name)} · ${esc(s.reason)} · ${s.status} ${s.status==='active'?`<button class="small" data-rv="${s.id}">Снять</button>`:''}</div>`).join('')||'<p class="muted small">Нет</p>'}
 <h3>Последние сообщения</h3>${d.recent_messages.map(m=>`<div class="small">${esc(m.text)} ${m.hidden?'<span class="tag r">скрыто</span>':''}</div>`).join('')||'<p class="muted small">Нет</p>'}`;
 $('#sgo').onclick=async()=>{await api('/social/sanctions','POST',{uralia_id:c.uralia_id,kind:$('#sk').value,reason:$('#sr').value||'Нарушение правил',minutes:$('#sm').value?+$('#sm').value:null});toast('Санкция выдана');findPlayer(id)};
 $('#vgo').onclick=async()=>{const r=await api('/vip','POST',{uralia_id:c.uralia_id,delta_xp:+$('#vl').value});toast('Теперь VIP '+r.vip_level)};
 document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=async()=>{await api('/social/sanctions/'+b.dataset.rv+'/revoke','POST',{});findPlayer(id)})}
if(sessionStorage.getItem('tok'))api('/web/overview').then(start).catch(login);else login();
</script>
</body>
