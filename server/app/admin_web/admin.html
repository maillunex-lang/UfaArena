<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Уралия — админ-панель</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
:root{--bg:#0b1416;--panel:#10201f;--panel2:#14292a;--line:#2c4a48;--gold:#e0ad4f;--gold2:#ffe3a1;--teal:#3fd6c8;
--text:#eef3f2;--muted:#9fb7b4;--red:#ff7a6b;--green:#7fe39a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:2px solid var(--gold);background:linear-gradient(#152a2b,#0e1c1d)}
header h1{margin:0;font-size:20px;color:var(--gold2);letter-spacing:.5px}header .sp{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);background:#0e1b1c}
nav button{white-space:nowrap}
main{padding:16px;max-width:1100px;margin:auto}
button,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit}
button:hover{border-color:var(--gold)}button.on,button.primary{background:linear-gradient(#e7b453,#b98326);color:#241400;border-color:var(--gold2);font-weight:600}
button.danger{background:#5a1f1a;border-color:#a8433a}button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:#08110f;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
textarea{min-height:70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.card h2{margin:0 0 10px;font-size:17px;color:var(--gold2)}.card h3{margin:12px 0 6px;font-size:15px;color:var(--teal)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 160px}.row>button{flex:0 0 auto}
.stat{background:var(--panel2);border-radius:12px;padding:10px 12px}.stat b{display:block;font-size:22px;color:var(--gold2)}
a{color:var(--teal)}a:hover{color:var(--gold2)}.muted{color:var(--muted)}.small{font-size:13px}.ok{color:var(--green)}.bad{color:var(--red)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.slot .pv{height:150px;border-radius:10px;background:#081010 repeating-conic-gradient(#0f1d1d 0 25%,#0b1616 0 50%) 50%/20px 20px;
display:flex;align-items:center;justify-content:center;overflow:hidden}.slot .pv img{max-width:100%;max-height:100%}
.slot .pv .empty{color:var(--muted);font-size:13px;text-align:center;padding:8px}
.prompt{font-size:12px;color:#cfe6e2;background:#081312;border:1px dashed #2c4a48;border-radius:8px;padding:6px 8px;max-height:120px;overflow:auto;white-space:pre-wrap;cursor:copy}
.prompt:hover{border-color:var(--gold)}.size{font-weight:700;color:var(--gold2)}button.copy{background:linear-gradient(#2c6b64,#1b4642);border-color:var(--teal);font-weight:600}
.tag{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;background:#24433f;color:var(--teal)}
.tag.g{background:#3c2f12;color:var(--gold2)}.tag.r{background:#4a1d19;color:var(--red)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#132826;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;display:none;max-width:90%}
.login{max-width:420px;margin:60px auto}.chatlog{max-height:440px;overflow:auto}
.chk{display:flex;gap:10px;align-items:center;padding:4px 0;cursor:pointer}.chk input{width:18px;height:18px}
.msg{padding:6px 0;border-bottom:1px solid #1b3331}
.uiwrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.uiside{flex:1 1 320px;min-width:0}
.phone{flex:0 0 auto;width:min(380px,100%);aspect-ratio:9/16;background:linear-gradient(#10282a,#0a1516);border:9px solid #1e2b2c;border-radius:30px;display:flex;flex-direction:column;overflow:hidden;font-size:12px;box-shadow:0 10px 40px #0008}
.ptop{display:flex;justify-content:space-between;padding:8px 10px;background:#0006;color:var(--gold2);font-weight:600}
.pscreen{flex:1;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:6px}
.pblock{position:relative;border:1px dashed transparent;border-radius:10px;padding:2px}.pblock:hover{border-color:#2c4a48}.pblock.hid{opacity:.35}
.ptag{position:absolute;top:-2px;right:6px;font-size:10px;color:var(--muted);pointer-events:none}
.pbar{background:#14292acc;border:1px solid #a37a2c88;border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center}
.pbtn{background:linear-gradient(#e7b453,#b98326);color:#241400;border-radius:8px;padding:2px 8px;font-weight:600}
.pmid{display:flex;gap:4px;min-height:220px}.pcol{display:flex;flex-direction:column;gap:4px;width:64px;min-height:120px;justify-content:center}
.psq{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;line-height:1.5;background:#0003;border-radius:10px}
.pl{border-radius:8px}.pl:empty{min-height:40px;border:1px dashed #2c4a48}
.pi{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 2px;border-radius:9px;text-align:center;user-select:none;touch-action:manipulation}
.pi .ic{width:34px;height:34px;border-radius:50%;background:#1d3a3b;border:1px solid #9fb7b455;display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden}
.pi .ic img,.icgrid img{width:100%;height:100%;object-fit:contain}.pi .lb{font-size:10px;line-height:1.1;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi.hid{opacity:.35}.pi.sel{outline:2px solid var(--gold2);background:#e0ad4f22}.pi.sortable-ghost{opacity:.3}
.pact{display:flex;gap:4px}.pact .pi{flex-direction:row;justify-content:center;min-height:52px;color:#fff;border:1px solid #fff4}.pact .pi .lb{font-size:13px;font-weight:700;max-width:none}
.pact .pi .ic{background:none;border:0}
.pnav{display:flex;justify-content:space-around;gap:2px;margin:6px;padding:4px;background:#a9c9ff22;border:1px solid #a9c9ff55;border-radius:18px}.pnav .pi{flex:1}
.pgrp{color:var(--gold2);font-weight:700;padding:4px 2px;cursor:pointer;border-radius:6px}.pgrp.sel{outline:2px solid var(--gold2)}
.pgrid{display:grid;gap:5px;min-height:44px}.pgrid .pi{background:#14292a;border:1px solid #a37a2c66;padding:6px 2px}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;margin-top:4px}.icgrid button{padding:4px;height:44px;font-size:20px}.msg .a{color:var(--gold2);font-weight:600}
</style>
</head>
<body>
<header><h1>⛰ Уралия — админ-панель</h1><span class="sp"></span><span id="who" class="muted small"></span>
<button id="logout" style="display:none">Выйти</button></header>
<nav id="nav" style="display:none"></nav>
<main id="main"></main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);const main=$('#main');
const TABS=[['overview','Обзор'],['server','Сервер и APK'],['events','События'],['chat','Чат'],['players','Игроки и модерация'],['ai','ИИ-жители'],['editor','Редактор игры'],['art','Графика'],['shop','Магазин']];
let tab='overview',artSec='heroes',aiSec='director',edSec='heroes',edUiView='home',patchPreset=null;
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(t,bad){const e=$('#toast');e.textContent=t;e.style.borderColor=bad?'#a8433a':'';e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3500)}
function hdr(extra){return Object.assign({'X-Admin-Token':sessionStorage.getItem('tok')||'','X-Admin-Name':encodeURIComponent(sessionStorage.getItem('who')||'owner')},extra||{})}
async function api(p,m='GET',b,raw){const o={method:m,headers:hdr(raw?{'Content-Type':'application/octet-stream'}:{'Content-Type':'application/json'})};
 if(b!==undefined)o.body=raw?b:JSON.stringify(b);const r=await fetch('/admin/api'+p,o);let d={};try{d=await r.json()}catch(e){}
 if(!r.ok){const msg=(d.detail&&d.detail.message)||d.detail||r.statusText;toast('Ошибка: '+msg,true);if(r.status===403&&String(msg).includes('токен')){logout()}throw new Error(msg)}return d}
async function copyText(t){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true}}catch(e){}
 const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);
 ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}
function saveBlob(blob,name){if(window.UraliaApp&&UraliaApp.saveFile){const fr=new FileReader();fr.onload=()=>{const ok=UraliaApp.saveFile(name,String(fr.result).split(',')[1],blob.type||'application/octet-stream');toast(ok?'Сохранено в «Загрузки»: '+name:'Не удалось сохранить файл',!ok)};fr.readAsDataURL(blob);return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-patch]');if(!b)return;e.preventDefault();const s=b.dataset.patch,i=s.indexOf(':');
 patchPreset={type:s.slice(0,i),id:s.slice(i+1)};tab='editor';edSec='patches';renderNav();show('editor').then(()=>window.scrollTo(0,0))});
const PB=(t,id,txt)=>`<button class="small" data-patch="${t}:${esc(id)}" title="Изменить с помощью ИИ или ZIP-патча">🤖 ${txt||'ИИ / патч'}</button>`;
function logout(){sessionStorage.removeItem('tok');try{localStorage.removeItem('tok')}catch(e){}location.reload()}
$('#logout').onclick=logout;
function login(){main.innerHTML=`<div class="card login"><h2>Вход</h2><p class="muted small">Токен — значение URALIA_ADMIN_TOKEN из файла .env на сервере (команда: grep URALIA_ADMIN_TOKEN /opt/uralia/.env).</p>
<div class="row"><input id="tok" type="password" placeholder="Токен администратора"></div><div class="row" style="margin-top:8px"><input id="nm" placeholder="Ваше имя (для журнала)" value="owner"></div>
<label class="chk" style="margin-top:8px"><input type="checkbox" id="rem" ${/UraliaAdmin/.test(navigator.userAgent)?'checked':''}> Запомнить вход на этом устройстве</label>
<div class="row" style="margin-top:10px"><button class="primary" id="go">Войти</button></div></div>`;
 $('#go').onclick=async()=>{sessionStorage.setItem('tok',$('#tok').value.trim());sessionStorage.setItem('who',$('#nm').value.trim()||'owner');
  try{await api('/web/overview');if($('#rem').checked){try{localStorage.setItem('tok',sessionStorage.getItem('tok'));localStorage.setItem('who',sessionStorage.getItem('who'))}catch(e){}}start()}catch(e){sessionStorage.removeItem('tok')}}}
function start(){$('#nav').style.display='flex';$('#logout').style.display='';$('#who').textContent=sessionStorage.getItem('who');renderNav();show(tab)}
function renderNav(){$('#nav').innerHTML=TABS.map(([k,t])=>`<button class="${k===tab?'on':''}" data-t="${k}">${t}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderNav();show(tab)})}
async function show(t){main.innerHTML='<p class="muted">Загрузка…</p>';try{await VIEWS[t]()}catch(e){main.innerHTML+=`<p class="bad">${esc(e.message)}</p>`}}
const fmt=n=>Number(n||0).toLocaleString('ru-RU');const time=s=>s?new Date(s).toLocaleString('ru-RU'):'—';

const VIEWS={
async overview(){const d=await api('/web/overview');
 main.innerHTML=`<div class="card"><h2>Сервер сейчас</h2><div class="grid">
 ${[['Игроков',d.players],['Онлайн (3 мин)',d.online],['Активны за сутки',d.active_day],['ИИ-жителей',d.ai],['Гильдий игроков',d.guilds],['ИИ-гильдий',d.ai_guilds],['Сообщений за час',d.chat_hour]]
  .map(([a,b])=>`<div class="stat">${a}<b>${fmt(b)}</b></div>`).join('')}</div></div>
 <div class="card"><h2>Активные события</h2>${d.events.length?d.events.map(e=>`<div>${esc(e.name)} — ${fmt(e.progress)} / ${fmt(e.goal)} · до ${time(e.ends_at)}</div>`).join(''):'<p class="muted">Нет</p>'}</div>
 <div class="card"><h2>Фоновые задачи</h2><table><tr><th>Задача</th><th>Последний запуск</th><th>Итог</th><th></th></tr>
 ${d.jobs.map(j=>`<tr><td>${j.name}</td><td class="small">${time(j.last_run_at)}</td><td class="small muted">${esc(j.last_status)}</td><td><button data-job="${j.name}">Запустить</button></td></tr>`).join('')}</table></div>`;
 document.querySelectorAll('[data-job]').forEach(b=>b.onclick=async()=>{const r=await api('/social/jobs/'+b.dataset.job+'/run','POST',{});toast(b.dataset.job+': '+JSON.stringify(r.result))})},

async server(){const [rel,mode]=await Promise.all([api('/web/release'),api('/status').catch(()=>({}))]);const r=rel.release;
 main.innerHTML=`<div class="card"><h2>Выпуск APK и окно «Вышло обновление»</h2>
 <div class="row"><label>Версия<input id="rv" value="${esc(r.version)}"></label><label>Мин. версия (ниже — обязательное обновление)<input id="rm" value="${esc(r.min_version)}"></label></div>
 <div class="row" style="margin-top:8px"><label>Заголовок<input id="rt" value="${esc(r.title||'')}"></label><label>Файл APK на сервере<select id="rf">${rel.apks.map(a=>`<option ${a.name===r.file?'selected':''}>${esc(a.name)}</option>`).join('')}<option value="">— внешняя ссылка —</option></select></label></div>
 <label style="display:block;margin-top:8px">Что нового (по строке на пункт)<textarea id="rn">${esc((r.notes||[]).join('\n'))}</textarea></label>
 <label style="display:block;margin-top:8px">Внешняя ссылка вместо файла (необязательно)<input id="ru" value="${esc(r.url||'')}" placeholder="https://..."></label>
 <div class="row" style="margin-top:10px"><button class="primary" id="rsave">Сохранить выпуск</button><a class="btn" href="/download" target="_blank">Страница загрузки</a></div>
 <h3>Загрузить APK на сервер</h3><div class="row"><input type="file" id="apk" accept=".apk"><button id="apkup">Загрузить</button></div><p id="apkst" class="muted small"></p>
 <p class="muted small">Файлы на сервере: ${rel.apks.map(a=>esc(a.name)+' ('+(a.size/1048576).toFixed(0)+' МБ)').join(', ')||'нет'}</p></div>
 <div class="card"><h2>ИИ-жители</h2><p class="muted small">Переключатели ИИ, AI Director, население и расписания — во вкладке «ИИ-жители».</p></div>
 <div class="card"><h2>Платежи</h2><p>Режим: <b>${esc(mode.mode||'?')}</b>. Реальные платежи выключены, пока не подключён провайдер. Каталог, заказы и промокоды — во вкладке «Магазин».</p></div>`;
 $('#rsave').onclick=async()=>{await api('/web/release','POST',{version:$('#rv').value.trim(),min_version:$('#rm').value.trim(),title:$('#rt').value,
  notes:$('#rn').value.split('\n').map(s=>s.trim()).filter(Boolean),url:$('#ru').value.trim()||null,file:$('#rf').value||null});toast('Выпуск сохранён — игроки увидят окно обновления')};
 $('#apkup').onclick=async()=>{const f=$('#apk').files[0];if(!f)return toast('Выберите файл',true);$('#apkst').textContent='Загрузка '+(f.size/1048576).toFixed(0)+' МБ…';
  const name=f.name.replace(/[^A-Za-z0-9._-]/g,'_');await api('/web/apk?name='+encodeURIComponent(name),'POST',f,true);$('#apkst').textContent='Загружено: '+name;toast('APK загружен');show('server')}},

async events(){const d=await api('/web/events');
 main.innerHTML=`<div class="card"><h2>Запустить мировое событие</h2><div class="row"><label>Шаблон<select id="et">${d.templates.map(t=>`<option value="${t.code}">${esc(t.name)} (${t.kind})</option>`).join('')}</select></label>
 <label>Длительность, часов<input id="eh" type="number" value="72"></label><label>Цель сервера (пусто — по шаблону)<input id="eg" type="number" placeholder="${d.templates[0]?.goal||''}"></label></div>
 <p class="muted small" id="edesc"></p><div class="row"><button class="primary" id="estart">Запустить</button></div>
 <h3>События</h3><table>${d.active.map(e=>`<tr><td>${esc(e.name)}</td><td>${fmt(e.progress)} / ${fmt(e.goal)}</td><td class="small">${e.status} · до ${time(e.ends_at)}</td><td>${e.status==='active'?`<button data-fin="${e.id}">Завершить сейчас</button>`:''}</td></tr>`).join('')}</table></div>
 <div class="card"><h2>Рейд-боссы</h2>${d.raids.map(r=>`<div class="row"><span>${r.kind==='world'?'Мировой':'Сезонный'}: ${esc(r.boss||'—')} ${r.hp_max?`(${fmt(r.hp_left)} / ${fmt(r.hp_max)})`:''}</span><button data-raid="${r.kind}">Новый босс сейчас</button></div>`).join('')}
 <p class="muted small">Текущий босс завершится (участники получат награду за участие), сразу появится новый.</p></div>
 <div class="card"><h2>Турнир сейчас</h2><div class="row"><label>Шаблон<select id="tt">${d.tournament_templates.map(t=>`<option value="${t.code}">${esc(t.name)}</option>`).join('')}</select></label><label>Регистрация, часов<input id="th" type="number" value="24"></label><button class="primary" id="tstart">Открыть регистрацию</button></div>
 <p class="muted small">Открытые: ${d.tournaments.map(t=>esc(t.name)+' ('+t.status+')').join(', ')||'нет'}</p></div>
 <div class="card"><h2>Подарок / письмо всем игрокам</h2><div class="row"><label>Заголовок<input id="mt" value="Подарок от хранителей"></label><label>Активны за последние, дней<input id="md" type="number" value="30"></label></div>
 <label style="display:block;margin-top:8px">Текст<textarea id="mb">Спасибо, что играете в Уралию!</textarea></label>
 <div class="row" style="margin-top:8px">${['gold','crystals','summon_essence','nature_essence','friend_tokens','raid_tickets'].map(k=>`<label>${{gold:'Золото',crystals:'Кристаллы',summon_essence:'Эссенция призыва',nature_essence:'Эссенция природы',friend_tokens:'Жетоны дружбы',raid_tickets:'Билеты рейда'}[k]}<input type="number" data-rw="${k}" value="0"></label>`).join('')}</div>
 <div class="row" style="margin-top:10px"><button class="primary" id="msend">Отправить всем</button></div></div>`;
 const tpl={};d.templates.forEach(t=>tpl[t.code]=t);const upd=()=>{$('#edesc').textContent=tpl[$('#et').value]?.desc||'';$('#eg').placeholder=tpl[$('#et').value]?.goal||''};$('#et').onchange=upd;upd();
 $('#estart').onclick=async()=>{await api('/web/events/start','POST',{template:$('#et').value,hours:+$('#eh').value,goal:$('#eg').value?+$('#eg').value:null});toast('Событие запущено');show('events')};
 document.querySelectorAll('[data-fin]').forEach(b=>b.onclick=async()=>{if(!confirm('Завершить событие сейчас? Итог применится к миру.'))return;const r=await api('/web/events/'+b.dataset.fin+'/finish','POST',{});toast('Итог: '+r.outcome);show('events')});
 document.querySelectorAll('[data-raid]').forEach(b=>b.onclick=async()=>{if(!confirm('Заменить босса?'))return;await api('/web/raids/respawn','POST',{kind:b.dataset.raid});toast('Новый босс появился');show('events')});
 $('#tstart').onclick=async()=>{await api('/web/tournaments/create','POST',{template:$('#tt').value,reg_hours:+$('#th').value});toast('Турнир открыт');show('events')};
 $('#msend').onclick=async()=>{const rw={};document.querySelectorAll('[data-rw]').forEach(i=>{if(+i.value>0)rw[i.dataset.rw]=+i.value});
  if(!confirm('Отправить письмо всем активным игрокам?'))return;const r=await api('/web/mail-all','POST',{title:$('#mt').value,body:$('#mb').value,rewards:rw,active_days:+$('#md').value});toast('Отправлено: '+r.recipients)}},

async chat(ch){ch=ch||'global';const d=await api('/web/chat?channel='+encodeURIComponent(ch));
 main.innerHTML=`<div class="card"><h2>Написать от имени администрации</h2><div class="row"><label>Канал<select id="cc"><option value="global">Общий чат</option>${d.guilds.map(g=>`<option value="${g.channel}" ${g.channel===ch?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label></div>

async art(){const d=await api('/web/art');
 main.innerHTML=`<div class="card"><h2>Замена графики</h2><p class="muted small">Каждый элемент графики игры — отдельный слот: где он виден в игре, точный размер, формат и готовый промпт для генератора. Загрузите PNG (или JPEG там, где не нужна прозрачность), затем нажмите «Опубликовать» — игроки получат графику фоновым обновлением, без нового APK. Пустые слоты используют встроенную графику. JPEG отображается в игре с версии 0.7.1, остальное — с 0.6.3 (для кнопок, панелей, меню, рамок, регионов и заголовков боя нужна 0.7.1).</p>
 <div class="row"><input id="afind" placeholder="Поиск по всем группам: название или файл" style="flex:1 1 280px"></div>
 <div class="row"><span>Опубликовано: версия ${d.published_version} · ${time(d.published_at)} ${d.dirty?'<span class="tag g">есть неопубликованные изменения</span>':''}</span><button class="primary" id="apub">Опубликовать для игроков</button></div></div>
 <nav style="border:0;padding:0 0 12px;background:none;flex-wrap:wrap">${d.sections.map(s=>`<button class="${s.id===artSec?'on':''}" data-sec="${s.id}">${esc(s.title)} (${s.slots.filter(x=>x.staged).length}/${s.slots.length})</button>`).join('')}</nav><div id="slots"></div>`;
 document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{artSec=b.dataset.sec;sessionStorage.removeItem('afind');VIEWS.art()});
 $('#apub').onclick=async()=>{if(!confirm('Опубликовать загруженную графику для всех игроков?'))return;const r=await api('/web/art/publish','POST',{});toast(`Опубликовано: графика v${r.version}`+(r.models?`, 3D-модели v${r.models.version}`:''));VIEWS.art()};
 const q=(sessionStorage.getItem('afind')||'').toLowerCase();
 const sec=q?{id:'search',title:'Поиск',hint:'Результаты поиска по всем группам.',slots:d.sections.flatMap(x=>x.slots.filter(sl=>(sl.title+' '+sl.path).toLowerCase().includes(q)))}:(d.sections.find(s=>s.id===artSec)||d.sections[0]);
 $('#afind').value=sessionStorage.getItem('afind')||'';
 $('#afind').onchange=()=>{sessionStorage.setItem('afind',$('#afind').value.trim());VIEWS.art()};
 $('#slots').innerHTML=`<div class="card"><div class="row"><p class="muted small" style="flex:1 1 300px">${esc(sec.hint)} Нажмите на текст промпта или на кнопку — он скопируется.</p><button class="copy" id="copyall">📋 Копировать все промпты раздела</button></div><div class="grid">${sec.slots.map((s,i)=>`<div class="slot" data-i="${i}">
  <b>${esc(s.title)}</b><span class="small">${s.model?'Формат: <span class="size">GLB (3D)</span>':`Размер: <span class="size">${esc(s.size)} px</span> · ${esc(s.formats)}`}${s.alpha?' <span class="tag g">прозрачный фон</span>':''} <span class="muted">· ${esc(s.path)}</span></span>
  <span class="small muted">Где в игре: ${esc(s.where||'')}</span><span>${PB('art',s.path)}</span>
  <div class="pv">${s.staged?(s.model?`<model-viewer data-glb="${esc(s.path)}" camera-controls auto-rotate autoplay shadow-intensity="1" style="width:100%;height:150px;background:#081010"></model-viewer>`:`<img data-src="${esc(s.path)}" alt="">`):`<div class="empty">${s.model?'Встроенная модель':'Встроенная графика'}<br>(слот пуст)</div>`}</div>
  ${s.staged?(s.model?`<span class="small">${(s.staged.size/1048576).toFixed(1)} МБ · анимаций ${(s.staged.animations||[]).length} · скелет ${s.staged.skins?'есть':'нет'} ${s.staged.published?'<span class="tag">в игре</span>':'<span class="tag g">не опубликовано</span>'}</span>
   ${s.kind==='hero'?`<div class="small" data-mset="${i}">${Object.entries(d.anim_keys).map(([k,n])=>`<label class="small" style="display:block">${esc(n)}<select data-ak="${k}"><option value="">— встроенная —</option>${(s.staged.animations||[]).map(a=>`<option ${s.staged.anims?.[k]===a?'selected':''}>${esc(a)}</option>`).join('')}</select></label>`).join('')}
   <label class="small" style="display:block">Масштаб<input type="number" step="0.05" data-as value="${s.staged.scale??1}"></label><button class="small primary" data-asave="${i}">Сохранить анимации и масштаб</button></div>`:''}`
   :`<span class="small">${s.staged.width}×${s.staged.height} · ${(s.staged.size/1024).toFixed(0)} КБ ${s.staged.published?'<span class="tag">в игре</span>':'<span class="tag g">не опубликовано</span>'}</span>`):''}
  <span class="small">${esc(s.advice)}</span><div class="prompt" data-copy="${i}" title="Нажмите, чтобы скопировать">${esc(s.prompt)}</div>
  <div class="row"><button class="small copy" data-copy="${i}">📋 Копировать промпт</button><label class="btn small" style="text-align:center">Загрузить ${s.model?'GLB':s.alpha?'PNG':'PNG / JPEG'}<input type="file" accept="${s.model?'.glb,model/gltf-binary':s.alpha?'image/png':'image/png,image/jpeg'}" data-up="${i}" style="display:none"></label>
  ${s.staged?`<button class="small danger" data-rm="${i}">Убрать</button>`:''}</div></div>`).join('')}</div></div>`;
 document.querySelectorAll('model-viewer[data-glb]').forEach(async mv=>{const r=await fetch('/admin/api/web/art/file?path='+encodeURIComponent(mv.dataset.glb),{headers:hdr()});if(r.ok)mv.src=URL.createObjectURL(await r.blob())});
 document.querySelectorAll('[data-asave]').forEach(b=>b.onclick=async()=>{const box=document.querySelector(`[data-mset="${b.dataset.asave}"]`);const an={};box.querySelectorAll('[data-ak]').forEach(x=>{if(x.value)an[x.dataset.ak]=x.value});

 document.querySelectorAll('img[data-src]').forEach(async im=>{const r=await fetch('/admin/api/web/art/file?path='+encodeURIComponent(im.dataset.src),{headers:hdr()});if(r.ok)im.src=URL.createObjectURL(await r.blob())});
 document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const ok=await copyText(sec.slots[+b.dataset.copy].prompt);
  toast(ok?'Промпт скопирован — вставьте его в генератор изображений':'Не удалось скопировать: выделите текст промпта вручную',!ok)});
 $('#copyall').onclick=async()=>{const t=sec.slots.map(s=>`=== ${s.title} → файл ${s.path.split('/').pop()} (${s.model?'GLB':s.size+' px'}) ===\n${s.prompt}`).join('\n\n');
  const ok=await copyText(t);toast(ok?`Скопированы все промпты раздела (${sec.slots.length})`:'Не удалось скопировать',!ok)};
 document.querySelectorAll('[data-up]').forEach(inp=>inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const s=sec.slots[+inp.dataset.up];
  if(s.model&&f.size>40*1048576)return toast('Файл модели больше 40 МБ',true);
  const r=await api('/web/art/upload?path='+encodeURIComponent(s.path),'POST',f,true);
  if(s.model){toast(`Модель загружена: анимаций ${(r.animations||[]).length}`+(s.kind==='hero'&&!(r.animations||[]).length?' — в файле нет анимаций!':''));VIEWS.art();return}
  const [w,h]=s.size.split('×').map(Number);
  toast(`Загружено ${r.width}×${r.height}`+((w&&(r.width/r.height).toFixed(2)!==(w/h).toFixed(2))?' — пропорции отличаются от рекомендованных':''));VIEWS.art()});
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{await api('/web/art/remove?path='+encodeURIComponent(sec.slots[+b.dataset.rm].path),'POST',{});VIEWS.art()})},

async heroes(box,openCode){const [d,m]=await Promise.all([api('/game/heroes?enemies=1'),api('/game/meta')]);const FN={},CN={};m.factions.forEach(f=>FN[f.code]=f.name);m.classes.forEach(c=>CN[c.code]=c.name);
 box.innerHTML=`<div class="card"><h2>Герои</h2><p class="small muted">Правки хранятся отдельно от кода игры: перезапуск и обновления сервера их не сотрут; каждая правка — в «Истории правок» с откатом. «Отключить» убирает героя из призыва и каталога; у игроков, которые его уже получили, герой остаётся. Новые герои сразу доступны серверу; их вид в приложении — встроенная модель (поле «Модель»), портрет — в «Графике» → «Портреты героев».</p>
 <div class="row"><button class="primary" id="hnew">Создать героя</button>${PB('hero','*','ИИ / патч (все герои)')}<input id="hq" placeholder="Поиск по имени или коду"><label class="chk" style="flex:0 0 auto"><input type="checkbox" id="hen"> враги и боссы</label></div>

   lore:v('f_lore'),summonable:$('#f_summonable').checked,is_enemy:$('#f_is_enemy').checked,skill:{kind:v('s_kind'),name:v('s_name'),power:+v('s_power'),desc:v('s_desc')},kit,
   extra:{growth:{hp:+v('g_hp'),atk:+v('g_atk'),def:+v('g_def')},crit:+v('x_crit'),crit_dmg:+v('x_crit_dmg'),appearance:v('x_appearance')}};
  const r=isNew?await api('/game/heroes','POST',{code:v('f_code').trim(),fields:f}):await api('/game/heroes/'+h.code,'PUT',{fields:f});toast(isNew?'Герой создан':'Сохранено');ED.heroes($('#edbox'),r.code)};
 if($('#hreset'))$('#hreset').onclick=async()=>{if(!confirm(h.custom?'Удалить созданного героя?':'Убрать все правки и вернуть героя как в коде игры?'))return;await api('/game/heroes/'+h.code+'/override','DELETE');toast('Готово');ED.heroes($('#edbox'))};
 $('#hbal').onclick=()=>{edSec='balance';VIEWS.editor()};
 el.scrollIntoView({behavior:'smooth'})},

async balance(box){box.innerHTML=`<div class="card"><h2>Баланс героев</h2><p class="small muted">Характеристики на выбранном уровне, самый сильный удар против героя со средней защитой (с учётом крита и разброса), сила относительно героев той же редкости и бои один на один настоящим боевым движком. Красным — что стоит проверить. Кнопка ниже копирует отчёт вместе с готовым заданием для ИИ-аналитика (вставьте в чат с Claude).</p>
 <div class="row"><label class="small">Уровень<input id="bl" type="number" value="40"></label><label class="small">Звёзды<input id="bs" type="number" value="0"></label><label class="chk"><input type="checkbox" id="bd" checked> дуэли 1×1 (дольше)</label><button class="primary" id="bgo">Посчитать</button><button class="copy" id="bcopy">📋 Скопировать отчёт и задание для анализа</button></div><div id="bres"></div></div>`;
 let last=null;
 const run=async()=>{$('#bres').innerHTML='<p class="muted">Считаю…</p>';const r=await api(`/game/balance?level=${+$('#bl').value}&stars=${+$('#bs').value}&duels=${$('#bd').checked?1:0}`);last=r;
  const rows=r.heroes.slice().sort((a,b)=>b.flags.length-a.flags.length||b.hit_pct_of_hp-a.hit_pct_of_hp);
  $('#bres').innerHTML=`<p class="small">Среднее здоровье героя: <b>${fmt(r.median_hp)}</b> · средняя защита: <b>${r.median_def}</b> · под подозрением: <b class="${r.flagged.length?'bad':'ok'}">${r.flagged.length}</b></p>
  <table><tr><th>Герой</th><th>Здоровье · атака · защита</th><th>Сила (откл. в редкости)</th><th>Сильнейший удар</th><th>% здоровья среднего героя</th><th>Дуэли</th><th>Замечания</th></tr>${rows.map(h=>`<tr><td><a href="#" data-bh="${h.code}"><b>${esc(h.name)}</b></a><div class="small muted">${RAR_N[h.rarity]} · ${esc(h.class)}</div></td><td class="small">${fmt(h.hp)} · ${fmt(h.atk)} · ${fmt(h.def)}</td><td class="small">${fmt(h.power)} (${h.power_z>0?'+':''}${h.power_z})</td>
   <td class="small">${esc(h.max_skill)} ×${h.max_mult}<div class="muted">${fmt(h.max_hit)} / крит ${fmt(h.max_crit_hit)}</div></td><td class="${h.hit_pct_of_hp>=100?'bad':h.hit_pct_of_hp>=60?'g':''}">${h.hit_pct_of_hp}%</td><td class="small">${h.duel_win_pct!=null?h.duel_win_pct+'%':'—'}</td><td class="small bad">${h.flags.map(esc).join('<br>')}</td></tr>`).join('')}</table>`;
  box.querySelectorAll('[data-bh]').forEach(a=>a.onclick=e=>{e.preventDefault();edSec='heroes';VIEWS.editor().then(()=>ED.heroes($('#edbox'),a.dataset.bh))})};
 $('#bgo').onclick=run;
 $('#bcopy').onclick=async()=>{if(!last)await run();const txt=BALANCE_PROMPT+'\n\n=== ОТЧЁТ (уровень '+last.level+', звёзды '+last.stars+') ===\n'+JSON.stringify(last,null,1);const ok=await copyText(txt);toast(ok?'Скопировано: вставьте в чат с Claude':'Не удалось скопировать',!ok)};
 run()},

async campaign(box,openNode){const d=await api('/game/campaign');const HN={};d.heroes.forEach(h=>HN[h.code]=h.name);
 box.innerHTML=`<div class="card"><h2>Кампания</h2><p class="small muted">Главы и этапы в порядке прохождения. Правки хранятся слоем поверх игры (с откатом в «Истории правок»). Пройденное игроками не теряется: скрытый этап просто выпадает из цепочки; этап, вставленный раньше текущего места игрока, станет для него следующим. Позиции точек на карте — в «Редакторе карты».</p>
 <div class="row"><button class="primary" id="cnewr">Новая глава</button><button class="primary" id="cnewn">Новый этап</button>${PB('node','*','ИИ / патч (все этапы)')}${PB('region','*','ИИ / патч (главы)')}</div></div>
 ${d.regions.map(r=>{const ns=d.nodes.filter(n=>n.region_code===r.code).sort((a,b)=>a.order-b.order);return `<div class="card"><div class="row"><h2 style="flex:1 1 300px">${r.order}. ${esc(r.name)} <span class="small muted">${r.code}</span> ${r.custom?'<span class="tag g">своя</span>':''}${r.edited?'<span class="tag">изменена</span>':''}${r.hidden?'<span class="tag r">скрыта</span>':''}</h2>${PB('node','region:'+r.code,'ИИ / патч главы')}
  <button class="small" data-redit="${r.code}">Изменить главу</button><button class="small" data-rhide="${r.code}" data-on="${r.hidden?0:1}">${r.hidden?'Показать':'Скрыть'}</button></div>
  <p class="small muted">${esc(r.real_place)} — ${esc((r.description||'').slice(0,240))}</p>
  <table>${ns.map((n,i)=>`<tr><td class="small">${n.order}</td><td><a href="#" data-nedit="${n.code}"><b>${esc(n.name)}</b></a> <span class="small muted">${n.code}</span> ${n.is_boss?'<span class="tag r">босс</span>':''}${n.custom?'<span class="tag g">свой</span>':''}${n.edited?'<span class="tag">изменён</span>':''}${n.hidden?'<span class="tag r">скрыт</span>':''}</td>
   <td class="small">${esc(d.territories[n.territory]||n.territory)} · врагов ${n.enemies.length} · ${n.enemies.map(e=>esc(HN[e.hero_code]||e.hero_code)+' '+e.level).join(', ').slice(0,90)}</td><td class="small muted">прошли ${n.players_cleared}</td>
   <td style="white-space:nowrap"><button class="small" data-up="${r.code}|${i}" ${i===0?'disabled':''}>↑</button><button class="small" data-down="${r.code}|${i}" ${i===ns.length-1?'disabled':''}>↓</button><button class="small" data-nhide="${n.code}" data-on="${n.hidden?0:1}">${n.hidden?'Показать':'Скрыть'}</button></td></tr>`).join('')||'<tr><td class="muted">Этапов нет</td></tr>'}</table></div>`}).join('')}
 <div id="cform"></div>`;
 const order=(rc)=>d.nodes.filter(n=>n.region_code===rc).sort((a,b)=>a.order-b.order).map(n=>n.code);
 const move=async(rc,i,dir)=>{const o=order(rc);[o[i],o[i+dir]]=[o[i+dir],o[i]];await api('/game/campaign/nodes/reorder','POST',{region_code:rc,codes:o});toast('Порядок изменён');ED.campaign(box)};
 box.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const [rc,i]=b.dataset.up.split('|');move(rc,+i,-1)});
 box.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const [rc,i]=b.dataset.down.split('|');move(rc,+i,1)});
 box.querySelectorAll('[data-nhide]').forEach(b=>b.onclick=async()=>{await api('/game/campaign/nodes/'+b.dataset.nhide+'/hide','POST',{hidden:b.dataset.on==='1'});toast('Сохранено');ED.campaign(box)});
 box.querySelectorAll('[data-rhide]').forEach(b=>b.onclick=async()=>{if(b.dataset.on==='1'&&!confirm('Скрыть всю главу из кампании?'))return;await api('/game/campaign/regions/'+b.dataset.rhide+'/hide','POST',{hidden:b.dataset.on==='1'});toast('Сохранено');ED.campaign(box)});
 box.querySelectorAll('[data-redit]').forEach(b=>b.onclick=()=>ED.regionForm($('#cform'),d,d.regions.find(r=>r.code===b.dataset.redit)));
 box.querySelectorAll('[data-nedit]').forEach(a=>a.onclick=e=>{e.preventDefault();ED.nodeForm($('#cform'),d,d.nodes.find(n=>n.code===a.dataset.nedit))});
 $('#cnewr').onclick=()=>ED.regionForm($('#cform'),d,null);$('#cnewn').onclick=()=>ED.nodeForm($('#cform'),d,null);
 if(openNode){const n=d.nodes.find(x=>x.code===openNode);if(n)ED.nodeForm($('#cform'),d,n)}},

regionForm(el,d,r){const isNew=!r;r=r||{code:'',name:'',order:(d.regions.reduce((m,x)=>Math.max(m,x.order),0)+1),real_place:'',description:''};
 el.innerHTML=`<div class="card"><h2>${isNew?'Новая глава':'Глава «'+esc(r.name)+'»'}</h2><div class="grid">${isNew?`<label class="small">Код (латиница, навсегда)<input id="r_code" placeholder="r8_new_land"></label>`:''}
 <label class="small">Название<input id="r_name" value="${esc(r.name)}"></label><label class="small">Порядок<input id="r_order" type="number" value="${r.order}"></label><label class="small">Реальное место / подзаголовок<input id="r_place" value="${esc(r.real_place)}"></label></div>
 <label class="small" style="display:block;margin-top:8px">Описание главы<textarea id="r_desc">${esc(r.description)}</textarea></label><div class="row" style="margin-top:8px"><button class="primary" id="rsave">${isNew?'Создать':'Сохранить'}</button></div></div>`;

 el.scrollIntoView({behavior:'smooth'})},

nodeForm(el,d,n){const isNew=!n;n=n||{code:'',region_code:d.regions[d.regions.length-1].code,order:99,name:'',territory:'nature',real_place:'',is_boss:false,enemies:[{hero_code:'e_minion',level:5,slot:0}],rewards:{gold:200},first_clear_rewards:{crystals:30},story:[],map_pos:[0,0]};
 const heroOpts=v=>d.heroes.map(h=>`<option value="${h.code}" ${h.code===v?'selected':''}>${esc(h.name)}${h.is_enemy?' (враг)':''}</option>`).join('');
 const curOpts=v=>d.currencies.map(c=>`<option ${c===v?'selected':''}>${c}</option>`).join('');
 const rwRows=(id,obj)=>`<div id="${id}">${Object.entries(obj).map(([k,v])=>`<div class="row" data-rw><select>${curOpts(k)}</select><input type="number" value="${v}"><button class="small danger" data-del>✕</button></div>`).join('')}</div><button class="small" data-addrw="${id}">+ ресурс</button>`;
 el.innerHTML=`<div class="card"><h2>${isNew?'Новый этап':'Этап «'+esc(n.name)+'»'}</h2><div class="grid">${isNew?`<label class="small">Код (навсегда, например 8-1)<input id="n_code"></label>`:''}
 <label class="small">Название<input id="n_name" value="${esc(n.name)}"></label><label class="small">Глава<select id="n_region">${d.regions.map(r=>`<option value="${r.code}" ${r.code===n.region_code?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label>
 <label class="small">Порядок в главе<input id="n_order" type="number" value="${n.order}"></label><label class="small">Местность (сцена боя)<select id="n_terr">${Object.entries(d.territories).map(([k,t])=>`<option value="${k}" ${k===n.territory?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
 <label class="small">Реальное место<input id="n_place" value="${esc(n.real_place)}"></label><label class="chk"><input type="checkbox" id="n_boss" ${n.is_boss?'checked':''}> Бой с боссом</label></div>
 <h3>Враги (позиции 0–1 — передний ряд, 2–4 — задний)</h3><div id="n_en">${n.enemies.map(e=>`<div class="row" data-en><select>${heroOpts(e.hero_code)}</select><input type="number" value="${e.level}" placeholder="уровень"><input type="number" value="${e.slot}" placeholder="позиция 0–4"><button class="small danger" data-del>✕</button></div>`).join('')}</div><button class="small" id="n_enadd">+ враг</button>
 <h3>Награды за победу</h3>${rwRows('n_rw',n.rewards)}<h3>Награды за первое прохождение</h3>${rwRows('n_fc',n.first_clear_rewards)}
 <h3>Диалог перед боем</h3><div id="n_story">${n.story.map(x=>`<div class="row" data-st><select>${d.speakers.concat(d.heroes.filter(h=>!h.is_enemy).map(h=>h.code)).map(sp=>`<option ${sp===x.speaker?'selected':''}>${sp}</option>`).join('')}</select><input value="${esc(x.text)}" style="flex:3 1 300px"><button class="small danger" data-del>✕</button></div>`).join('')}</div><button class="small" id="n_stadd">+ реплика</button>
 <div class="row" style="margin-top:12px"><button class="primary" id="nsave">${isNew?'Создать':'Сохранить'}</button>${!isNew&&(n.custom||n.edited)?`<button class="danger" id="nreset">${n.custom?'Удалить этап':'Вернуть как в игре'}</button>`:''}
 ${!isNew?`<label class="small" style="flex:0 0 120px">Уровень отряда<input id="n_simlv" type="number" value="${Math.max(1,...n.enemies.map(e=>e.level))}"></label><button id="nsim">Проверить сложность</button>`:''}</div><div id="n_simres" class="small"></div></div>`;
 const wire=()=>el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>b.parentElement.remove());wire();
 $('#n_enadd').onclick=()=>{$('#n_en').insertAdjacentHTML('beforeend',`<div class="row" data-en><select>${heroOpts('e_minion')}</select><input type="number" value="5"><input type="number" value="${$('#n_en').children.length}"><button class="small danger" data-del>✕</button></div>`);wire()};
 el.querySelectorAll('[data-addrw]').forEach(b=>b.onclick=()=>{$('#'+b.dataset.addrw).insertAdjacentHTML('beforeend',`<div class="row" data-rw><select>${curOpts('gold')}</select><input type="number" value="100"><button class="small danger" data-del>✕</button></div>`);wire()});
 $('#n_stadd').onclick=()=>{$('#n_story').insertAdjacentHTML('beforeend',`<div class="row" data-st><select>${d.speakers.concat(d.heroes.filter(h=>!h.is_enemy).map(h=>h.code)).map(sp=>`<option>${sp}</option>`).join('')}</select><input style="flex:3 1 300px"><button class="small danger" data-del>✕</button></div>`);wire()};
 const rw=id=>{const o={};$('#'+id).querySelectorAll('[data-rw]').forEach(r=>{const v=+r.querySelector('input').value;if(v>0)o[r.querySelector('select').value]=v});return o};
 $('#nsave').onclick=async()=>{const f={name:$('#n_name').value,region_code:$('#n_region').value,order:+$('#n_order').value,territory:$('#n_terr').value,real_place:$('#n_place').value,is_boss:$('#n_boss').checked,
  enemies:[...$('#n_en').querySelectorAll('[data-en]')].map(r=>{const i=r.querySelectorAll('input');return {hero_code:r.querySelector('select').value,level:+i[0].value,slot:+i[1].value}}),
  rewards:rw('n_rw'),first_clear_rewards:rw('n_fc'),story:[...$('#n_story').querySelectorAll('[data-st]')].map(r=>({speaker:r.querySelector('select').value,text:r.querySelector('input').value})).filter(x=>x.text.trim())};
  const r=isNew?await api('/game/campaign/nodes','POST',{code:$('#n_code').value.trim(),fields:{...f,map_pos:[0,0]}}):await api('/game/campaign/nodes/'+n.code,'PUT',{fields:f});toast(isNew?'Этап создан':'Сохранено');ED.campaign($('#edbox'),r.code)};
 if($('#nreset'))$('#nreset').onclick=async()=>{if(!confirm(n.custom?'Удалить этап?':'Вернуть этап как в коде игры?'))return;await api('/game/campaign/nodes/'+n.code+'/override','DELETE');toast('Готово');ED.campaign($('#edbox'))};
 if($('#nsim'))$('#nsim').onclick=async()=>{$('#n_simres').textContent='Считаю…';const r=await api(`/game/campaign/nodes/${n.code}/simulate?level=${+$('#n_simlv').value}`);
  $('#n_simres').innerHTML=`Сильнейший отряд уровня ${r.level} (${r.team.map(esc).join(', ')}): побед <b class="${r.win_pct>=80?'ok':r.win_pct>=30?'g':'bad'}">${r.win_pct}%</b>, в среднем ${r.avg_rounds} раундов · сила отряда ${fmt(r.team_power)}, врагов ${fmt(r.enemy_power)}`};
 el.scrollIntoView({behavior:'smooth'})},

async map(box,regionCode){const d=await api('/game/campaign/map');let mode=regionCode?'region':'world';let rc=regionCode||d.regions[0]?.code;
 const render=async()=>{box.innerHTML=`<div class="card"><h2>Редактор карты</h2><div class="row"><button class="${mode==='world'?'on':''}" id="mw">Карта мира</button><button class="${mode==='region'?'on':''}" id="mr">Карта региона</button>
  ${mode==='region'?`<select id="mrs" style="flex:0 1 260px">${d.regions.map(r=>`<option value="${r.code}" ${r.code===rc?'selected':''}>${esc(r.name)}</option>`).join('')}</select>`:''}${PB('map','*')}<button class="primary" id="msave">Сохранить расположение</button></div>
  <p class="small muted">${mode==='world'?'Перетащите регионы мышью или пальцем. Линии — дороги каравана. Положение на карте мира видно в приложении после следующей сборки APK.':'Перетащите точки этапов: они прилипают к сетке, которую понимает игра (видно уже в нынешнем приложении после публикации — сохранение применяется сразу). Путь идёт по порядку этапов снизу вверх; порядок меняется в разделе «Кампания».'}</p>
  <div id="mcanvas" style="background:#081314;border:1px solid var(--line);border-radius:12px;touch-action:none;user-select:none"></div><p class="small muted" id="mhint"></p></div>`;
  $('#mw').onclick=()=>{mode='world';render()};$('#mr').onclick=()=>{mode='region';render()};if($('#mrs'))$('#mrs').onchange=()=>{rc=$('#mrs').value;render()};
  if(mode==='world')await worldMap();else regionMap()};
 const svgEl=(t,a)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);return e};
 const drag=(svg,el,onMove,onEnd)=>{el.style.cursor='grab';el.addEventListener('pointerdown',ev=>{ev.preventDefault();el.setPointerCapture(ev.pointerId);
  const mv=e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());onMove(p.x,p.y)};
  const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);onEnd&&onEnd()};el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)})};
 const worldMap=async()=>{const W=1000,H=750;const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%'});$('#mcanvas').appendChild(svg);

  else{svg.appendChild(svgEl('rect',{x:0,y:0,width:W,height:H,fill:'#0f2328'}));for(let k=0;k<11;k++)svg.appendChild(svgEl('path',{d:`M${820+(k%2)*40} ${60+k*60} l40 -50 l40 50 z`,fill:'#1c3a3c'}))}

 ${list.items.map(c=>`<tr><td><a href="#" data-open="${c.id}"><b>${esc(c.nickname)}</b></a> <span class="tag">ИИ</span><div class="small muted">${c.uralia_id} · ${esc(AI_TIER[c.tier]||'—')} · ${moodTxt(c.mood)}</div></td>
  <td class="small">${esc(AI_ARCH[c.archetype]||c.archetype)}<div class="muted">${esc(c.archetype_desc)} · ${esc(AI_STYLE[c.style]||c.style)}</div></td><td>${c.level} / ${fmt(c.power)}</td>
  <td class="small">${!c.active?'<span class="tag r">пауза</span>':c.in_session?'<span class="tag">в игре</span>':'не в сети'}<div class="muted">действий сегодня ${c.actions_today} · ${ago(c.last_action_at)}</div></td>
  <td><div class="row" style="flex-wrap:nowrap"><select data-act="${c.id}">${Object.entries(AI_ACT).map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select><button class="small" data-run="${c.id}">Запустить</button>
  <button class="small ${c.active?'danger':''}" data-pause="${c.id}" data-on="${c.active?0:1}">${c.active?'Пауза':'Вернуть'}</button></div></td></tr>`).join('')||'<tr><td class="muted">Никого не найдено</td></tr>'}</table>
 <p class="small muted">Показаны до 100, сильнейшие сверху. «Пауза» не удаляет ИИ — прогресс и история сохраняются.</p></div>`;
 const go=()=>{sessionStorage.setItem('aiq',$('#aiq').value.trim());sessionStorage.setItem('aionly',$('#aionly').value);AI.people(box,$('#aiq').value.trim(),$('#aionly').value)};
 $('#aifind').onclick=go;$('#aiq').onkeydown=e=>{if(e.key==='Enter')go()};$('#aionly').onchange=go;
 box.querySelectorAll('[data-run]').forEach(b=>b.onclick=async()=>{const a=box.querySelector(`[data-act="${b.dataset.run}"]`).value;const r=await api('/ai/characters/'+b.dataset.run+'/run?action='+a,'POST',{});toast('Поставлено в очередь. '+r.note)});
 box.querySelectorAll('[data-pause]').forEach(b=>b.onclick=async()=>{await api('/ai/characters/'+b.dataset.pause+'/active','POST',{active:b.dataset.on==='1'});toast(b.dataset.on==='1'?'ИИ возвращён':'ИИ на паузе');AI.people(box)});
 box.querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();AI.card(box,a.dataset.open)})},

async card(box,id){const d=await api('/ai/characters/'+id);const P=d.personality,D=d.dict;
 const bar=v=>`<span style="display:inline-block;width:120px;height:8px;border-radius:4px;background:#24433f;vertical-align:middle"><span style="display:block;height:8px;border-radius:4px;width:${Math.round((v||0)*100)}%;background:var(--gold)"></span></span> ${Math.round((v||0)*100)}`;
 box.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1 1 300px">${esc(d.nickname)} <span class="tag">ИИ</span> <span class="muted small">${d.uralia_id}</span></h2><button id="cback">← К списку</button></div>
 <div class="grid">${[['Уровень / сила',d.level+' / '+fmt(d.power)],['Слой силы',esc(P.tier_name||'—')+' · темп ×'+(P.pace??1)],['Характер',esc(AI_ARCH[d.archetype]||d.archetype)+' · '+esc(AI_STYLE[d.style]||d.style)],
  ['Настроение',moodTxt(P.mood)],['Тактика',esc(d.strategy_name||'—')],['Версия характера',P.version],['Расписание',esc(d.schedule||'—')],['VIP','0 (у ИИ не бывает)']]
  .map(([a,b])=>`<div class="stat">${a}<b style="font-size:16px">${b}</b></div>`).join('')}</div>
 <p class="small">${esc(d.backstory)}</p>
 <p class="small muted">Арена: побед ${P.counters.arena_wins||0}, поражений ${P.counters.arena_losses||0}, серия побед ${P.counters.wins_row||0}, серия поражений ${P.counters.losses_row||0}, перерывов ${P.counters.breaks||0}</p></div>
 <div class="card"><h2>Черты, амбиции, привычки</h2><table>${P.traits.map(t=>`<tr><td>${t.name}</td><td>${bar(t.value)}</td><td><input type="number" min="0" max="100" data-tr="${t.code}" value="${Math.round((t.value||0)*100)}" style="width:80px"></td></tr>`).join('')}</table>
 <div class="row" style="margin-top:8px"><label>Амбиции<select id="camb" multiple size="5">${Object.entries(D.ambitions).map(([k,n])=>`<option value="${k}" ${P.ambitions.some(a=>a.code===k)?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
 <label>Привычки<select id="chab" multiple size="5">${Object.entries(D.habits).map(([k,n])=>`<option value="${k}" ${P.habits.some(a=>a.code===k)?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
 <label>Слой силы<select id="ctier">${Object.entries(D.tiers).map(([k,n])=>`<option value="${k}" ${k===P.tier?'selected':''}>${esc(n)}</option>`).join('')}</select>Настроение, -100…100<input id="cmood" type="number" min="-100" max="100" value="${Math.round((P.mood||0)*100)}"></label></div>
 <label class="small" style="display:block;margin-top:8px">Предыстория<textarea id="cback2">${esc(d.backstory)}</textarea></label>
 <p class="small muted">Несколько амбиций или привычек — с зажатой клавишей Ctrl (на телефоне — касанием).</p>
 <p class="small muted">Манера речи: ${P.voice.catchphrase?'присказка «'+esc(P.voice.catchphrase)+'», ':''}эмодзи ${Math.round((P.voice.emoji||0)*100)}%${P.voice.lowercase?', пишет с маленькой буквы':''}${P.voice.ellipsis?', любит многоточия':''}.</p>
 <div class="row"><button class="primary" id="csave">Сохранить характер</button><button id="cchk">Создать контрольную точку</button><button id="cexp">Экспорт (перенос профиля)</button><button id="cexc">Не писать игрокам первым</button><label class="btn" style="text-align:center">Импорт…<input type="file" id="cimp" accept=".json" style="display:none"></label></div>
 <p class="small muted">Перед каждой правкой, восстановлением и импортом автоматически создаётся контрольная точка. Игровой прогресс (герои, уровень, ресурсы) не меняется.</p></div>
 <div class="card" id="cgame"><h2>Игровой прогресс</h2><p class="muted small">Загрузка…</p></div>
 <div class="card"><h2>Отношения</h2><p class="small muted">Репутация среди ИИ-жителей: <b>${d.reputation}</b>${d.group?` · круг «${esc(d.group.name)}»`:''}</p>
 <table>${(d.relationships||[]).map(r=>`<tr><td><b>${esc(r.nickname)}</b> ${r.is_ai?'<span class="tag">ИИ</span>':'<span class="tag g">игрок</span>'}</td><td class="small">${esc(r.label)}</td><td class="small muted">симпатия ${r.sympathy} · доверие ${r.trust} · соперничество ${r.rivalry} · неприязнь ${r.dislike}</td><td class="small muted">${r.interactions} встреч</td></tr>`).join('')||'<tr><td class="muted">Пока ни с кем не знаком близко</td></tr>'}</table></div>
 <div class="card"><h2>Биография</h2>${d.biography.slice().reverse().map(e=>`<div class="msg"><span class="a">${esc(D.bio[e.kind]||e.kind)}</span> <span class="muted small">${time(e.at)}</span><div>${esc(e.text)}</div></div>`).join('')||'<p class="muted">Пока пусто</p>'}</div>
 <div class="card"><h2>Память (последние 40)</h2><table>${d.memories.map(m=>`<tr><td class="small">${esc(m.kind_name)}</td><td>${esc(m.text)}${m.subject?`<div class="small muted">о ком: ${esc(m.subject)}</div>`:''}</td><td class="small">важность ${m.importance}</td><td class="small muted">${ago(m.at)}</td></tr>`).join('')||'<tr><td class="muted">Пусто</td></tr>'}</table></div>
 <div class="card"><h2>Контрольные точки</h2><table>${d.snapshots.map(x=>`<tr><td class="small">v${x.version}</td><td>${esc(x.reason)}</td><td class="small muted">${esc(x.by)} · ${time(x.at)}</td><td><button class="small" data-rs="${x.id}">Восстановить</button></td></tr>`).join('')}</table></div>
 <div class="card"><h2>Архив</h2>${d.archive.map(a=>`<div class="small"><b>${a.period}</b>: ${Object.entries(a.stats).map(([k,v])=>esc(k.replace('act:','').replace('mem:','память: '))+' '+v).join(', ')}</div>`).join('')||'<p class="muted small">Архив появится, когда записям исполнится больше срока горячей памяти.</p>'}</div>`;
 $('#cback').onclick=()=>AI.people(box);
 AI.cardGame($('#cgame'),id);
 $('#csave').onclick=async()=>{const tr={};box.querySelectorAll('[data-tr]').forEach(i=>tr[i.dataset.tr]=Math.max(0,Math.min(100,+i.value))/100);
  const sel=id=>[...$(id).selectedOptions].map(o=>o.value);
  await api('/ai/characters/'+id,'PATCH',{traits:tr,ambitions:sel('#camb'),habits:sel('#chab'),tier:$('#ctier').value,mood:Math.max(-100,Math.min(100,+$('#cmood').value))/100,backstory:$('#cback2').value});toast('Характер сохранён');AI.card(box,id)};
 $('#cexc').onclick=async()=>{await api('/ai/outreach/exceptions','POST',{persona_id:id,add:true});toast('Этот ИИ больше не пишет игрокам первым')};
 $('#cchk').onclick=async()=>{await api('/ai/characters/'+id+'/checkpoint','POST',{reason:'Ручная контрольная точка'});toast('Контрольная точка создана');AI.card(box,id)};
 $('#cexp').onclick=async()=>{const x=await api('/ai/characters/'+id+'/export');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(x,null,1)],{type:'application/json'}));a.download='ai_'+d.uralia_id+'.json';a.click()};
 $('#cimp').onchange=async()=>{const f=$('#cimp').files[0];if(!f)return;if(!confirm('Перенести характер, биографию и память из файла в этого персонажа?'))return;
  await api('/ai/characters/'+id+'/import','POST',JSON.parse(await f.text()));toast('Профиль перенесён');AI.card(box,id)};
 box.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{if(!confirm('Восстановить характер из этой контрольной точки?'))return;await api('/ai/characters/'+id+'/restore/'+b.dataset.rs,'POST',{});toast('Восстановлено');AI.card(box,id)})},

async cardGame(el,id){const g=await api('/ai/characters/'+id+'/game');const RAR={1:'обычный',2:'необычный',3:'редкий',4:'эпический',5:'легендарный',6:'мифический'};
 el.innerHTML=`<h2>Игровой прогресс</h2><p class="small muted">По умолчанию ИИ играют по тем же правилам, что игроки: ресурсы — из дозора, кампании и заданий, траты — по ценам игры. Правки ниже записываются в журнал (ресурсы — через общую книгу операций).</p>
 <div class="grid">${[['Кампания',g.campaign.cleared+' этапов'+(g.campaign.next?' · далее «'+esc(g.campaign.next)+'»':'')],['Арена',g.arena?g.arena.rating+' ('+g.arena.wins+' / '+g.arena.losses+')':'—'],['Сила защиты',g.arena?fmt(g.arena.defense_power):'—'],['Экономика',esc(g.economies[g.economy])]].map(([a,b])=>`<div class="stat">${a}<b style="font-size:16px">${b}</b></div>`).join('')}</div>
 <h3>Ресурсы</h3><div class="small">${Object.entries(g.wallet).filter(([k,v])=>v).map(([k,v])=>esc(k)+' '+fmt(v)).join(' · ')||'пусто'}</div>
 <div class="row" style="margin-top:6px"><select id="gwc">${g.currencies.map(c=>`<option>${c}</option>`).join('')}</select><input id="gwd" type="number" placeholder="+ выдать / − забрать"><button id="gws">Применить</button></div>
 <h3>Тактика и экономика</h3><div class="row"><select id="gst">${Object.entries(g.strategies).map(([k,n])=>`<option value="${k}" ${k===g.strategy?'selected':''}>${esc(n)}</option>`).join('')}</select><select id="gec">${Object.entries(g.economies).map(([k,n])=>`<option value="${k}" ${k===g.economy?'selected':''}>${esc(n)}</option>`).join('')}</select><button id="gss">Сохранить</button><button id="grb">Перестроить отряд</button><button class="primary" id="gpl">Сыграть заход сейчас</button></div>
 <h3>Герои (${g.heroes.length})</h3><table>${g.heroes.map(h=>`<tr><td><b>${esc(h.name)}</b> <span class="small muted">${RAR[h.rarity]||h.rarity} · ${esc(h.class)}${g.formation.includes(h.id)?' · <span class="tag">в отряде</span>':''}</span></td><td><input type="number" data-hl="${h.id}" value="${h.level}" style="width:80px"> ур.</td><td><input type="number" data-hs="${h.id}" value="${h.stars}" style="width:70px"> ★</td><td><button class="small" data-hsave="${h.id}">Сохранить</button></td></tr>`).join('')}</table>
 <div class="row" style="margin-top:6px"><select id="gha">${g.summonable.map(h=>`<option value="${h.code}">${esc(h.name)} (${RAR[h.rarity]||h.rarity})</option>`).join('')}</select><button id="ghadd">Выдать героя</button></div>`;
 $('#gws').onclick=async()=>{await api('/ai/characters/'+id+'/wallet','POST',{currency:$('#gwc').value,delta:+$('#gwd').value});toast('Ресурсы изменены');AI.cardGame(el,id)};
 $('#gss').onclick=async()=>{await api('/ai/characters/'+id+'/strategy','POST',{strategy:$('#gst').value,economy:$('#gec').value});toast('Сохранено')};
 $('#grb').onclick=async()=>{await api('/ai/characters/'+id+'/rebuild','POST',{});toast('Отряд перестроен');AI.cardGame(el,id)};
 $('#gpl').onclick=async()=>{await api('/ai/characters/'+id+'/play','POST',{});toast('Заход поставлен в очередь — выполнится в рабочем режиме Director')};
 $('#ghadd').onclick=async()=>{await api('/ai/characters/'+id+'/heroes','POST',{hero_code:$('#gha').value});toast('Герой выдан');AI.cardGame(el,id)};
 el.querySelectorAll('[data-hsave]').forEach(b=>b.onclick=async()=>{const h=b.dataset.hsave;await api('/ai/characters/'+id+'/heroes/'+h,'PATCH',{level:+el.querySelector(`[data-hl="${h}"]`).value,stars:+el.querySelector(`[data-hs="${h}"]`).value});toast('Герой изменён')})},

async game(box){const e=await api('/ai/economy');
 box.innerHTML=`<div class="card"><h2>Экономика ИИ</h2><p class="small muted">ИИ получают ресурсы только из тех же источников, что игроки, и тратят их по ценам игры. Торговли и аукциона в игре нет (решение D-04), поэтому ИИ не влияют на цены и не могут передать ресурсы игрокам. Ниже — балансы всех ИИ и движение за сутки по книге операций.</p>
 <div class="grid">${Object.entries(e.balances).map(([k,v])=>`<div class="stat">${esc(k)}<b>${fmt(v)}</b></div>`).join('')||'<p class="muted">Пусто</p>'}</div>
 <p class="small">Боёв кампании за сутки: <b>${fmt(e.battles_24h)}</b> · ${Object.entries(e.campaign_24h||{}).map(([k,v])=>esc(k)+' '+v).join(' · ')}</p>
 <table><tr><th>Операция</th><th>Ресурс</th><th>Сумма за 24 ч</th><th>Раз</th></tr>${e.flows_24h.sort((a,b)=>Math.abs(b.sum)-Math.abs(a.sum)).slice(0,30).map(f=>`<tr><td class="small">${esc(f.reason)}</td><td class="small">${esc(f.currency)}</td><td class="${f.sum<0?'bad':'ok'}">${fmt(f.sum)}</td><td class="small">${f.count}</td></tr>`).join('')||'<tr><td class="muted">Операций пока нет</td></tr>'}</table></div>
 <div id="gplay"></div><div id="gpvp"></div><div id="gev"></div>`;
 await AI.section($('#gplay'),'play','Развитие ИИ по правилам игры','Кампания боями, улучшение героев за золото и эссенцию, призыв, модули каравана, задания, вклад в казну гильдии — те же функции, что у игрока. Лимиты в день не дают ИИ «жить в игре» круглосуточно.');
 await AI.section($('#gpvp'),'pvp','PvP: арена, турниры, рейтинги','ИИ выбирают разрешённых соперников, анализируют их силу и фракции, перестраивают отряд после поражений и помнят бои. Места и награды рейтингов — только у игроков (D-03). Показ ИИ в общих рейтингах включайте после выхода нового APK.');
 await AI.section($('#gev'),'events','События и активности ИИ','Вклад ИИ в мировые события — отдельной строкой «вклад ИИ-жителей», не больше 20% цели, без наград и мест (D-05). ИИ-гильдии проводят соревнования недели, круги друзей — дружеские турниры (без наград).')},

async section(box,name,title,note,extra){const d=await api('/ai/settings/'+name);const S=d.settings;
 const inp=(k)=>{const f=d.fields[k],v=S[k];if(f.kind==='bool')return `<label class="chk"><input type="checkbox" data-sk="${k}" ${v?'checked':''}> ${esc(d.names[k]||k)}</label>`;
  if(f.kind==='choice')return `<label class="small">${esc(d.names[k]||k)}<select data-sk="${k}">${f.args.map(o=>`<option value="${o}" ${o===v?'selected':''}>${esc((AI_CHOICE[o]||o))}</option>`).join('')}</select></label>`;
  return `<label class="small">${esc(d.names[k]||k)}<input data-sk="${k}" ${f.kind==='int'?`type="number" min="${f.args[0]}" max="${f.args[1]}"`:''} value="${esc(v)}">${v!==d.defaults[k]?`<span class="muted">по умолчанию ${esc(d.defaults[k])}</span>`:''}</label>`};
 box.innerHTML=`<div class="card"><h2>${title}</h2><p class="small muted">${note}</p>${extra?extra(d):''}<div class="grid">${Object.keys(d.fields).map(inp).join('')}</div>
 <div class="row" style="margin-top:10px"><button class="primary" id="ssave">Сохранить</button><button id="srb">Откатить к предыдущим</button>${PB('ai_settings',name)}</div></div><div id="sx"></div>`;
 box.querySelector('#ssave').onclick=async()=>{const ch={};box.querySelectorAll('[data-sk]').forEach(i=>{const k=i.dataset.sk,f=d.fields[k];const v=f.kind==='bool'?i.checked:f.kind==='int'?+i.value:i.value;if(v!==S[k])ch[k]=v});
  if(!Object.keys(ch).length)return toast('Изменений нет');await api('/ai/settings/'+name,'POST',ch);toast('Сохранено');VIEWS.ai()};
 box.querySelector('#srb').onclick=async()=>{if(!confirm('Вернуть предыдущую версию настроек?'))return;await api('/ai/settings/'+name+'/rollback','POST',{});toast('Откат выполнен');VIEWS.ai()};
 return d},

async speech(box){await AI.section(box,'speech','Речь и интеллект ИИ','Основа — локальные шаблоны и сценарии, работают всегда. Каждый ИИ говорит в своей манере, настроение окрашивает речь, при интеллекте 3+ ИИ вспоминают прошлые разговоры. Языковая модель необязательна и отвечает только живым игрокам при интеллекте 5; беседы ИИ между собой всегда на шаблонах. При любой ошибке модели — шаблоны.',
 d=>`<p class="small">Модель: <b>${d.llm.enabled?(d.llm.available?'<span class="ok">готова</span>':'<span class="bad">недоступна</span>'):'выключена'}</b> · ${esc(d.llm.provider_name||'')} — ${esc(d.llm.reason)}${d.llm.last_error?' · последняя ошибка: '+esc(d.llm.last_error):''}${d.llm.last_latency_ms!=null?' · ответ за '+d.llm.last_latency_ms+' мс':''} · запросов за час ${d.llm.calls_hour||0}</p>`);
 const d=await api('/ai/settings/speech');const sx=$('#sx');
 sx.innerHTML=`<div class="card"><h2>Поставщики языковой модели</h2>
 <p class="small muted">Выберите поставщика в поле «Поставщик модели» выше, включите «Языковая модель…», поставьте «Интеллект» = 5 и сохраните. Ключ API хранится только на сервере: в журнал не пишется, обратно не показывается (видны последние 4 символа), в приложение не попадает. Ключ из файла .env (URALIA_LLM_GROQ_KEY и т. п.) важнее ключа из админки.</p>

async social(box){const d=await api('/ai/social/overview');

 box.querySelectorAll('[data-gact]').forEach(b=>b.onclick=async()=>{await api('/ai/groups/'+b.dataset.gact+'/active','POST',{active:b.dataset.on==='1'});toast('Сохранено');AI.social(box)})},

async outreach(box){await AI.section(box,'outreach','Общение ИИ с реальными игроками','ИИ первыми пишут только тем, кто сейчас в игре, не чаще лимитов, никогда — если игрок отключил это в настройках, заблокировал ИИ или внесён в исключения. Все сообщения ИИ помечены «ИИ».');

async channels(box){await AI.section(box,'channels','Каналы чата','Региональный канал — земля, где стоит караван игрока; канал события — пока идёт мировое событие; чат союза — для гильдий в союзе; чат группы — для неформального круга; «Объявления» — пишет только администрация (вкладка «Чат»). ИИ пишут только там, где сейчас есть кому читать, и с теми же паузами, что в общем чате. Новые каналы появятся в приложении в следующей сборке APK.')},

async archetypes(box){const [a,t]=await Promise.all([api('/ai/archetypes'),api('/ai/settings/tiers')]);

 box.innerHTML=`<div class="card"><h2>Слои силы</h2><p class="small muted">Доли новых ИИ по слоям. Уровень реальных игроков (90-й перцентиль за 14 дней): <b>${t.world_level??'нет данных'}</b>. Слои до «опытного» не обгоняют мир больше чем на заданный запас; ветераны и элита могут вести мир, но в пределах своего слоя.</p>

 <p class="small muted">Амбиции: ${Object.entries(a.ambitions).map(([k,v])=>k+' — '+v.toLowerCase()).join('; ')}. Стили речи архетипа сохраняются как были.</p></div>`;

  sx.querySelectorAll('[data-ms]').forEach(b=>b.onclick=async()=>{await api('/ai/memory/'+b.dataset.ms,'PATCH',{text:sx.querySelector(`[data-mt="${b.dataset.ms}"]`).value,importance:+sx.querySelector(`[data-mi="${b.dataset.ms}"]`).value});toast('Сохранено (старое значение — в журнале администраторов)')});
  sx.querySelectorAll('[data-mo]').forEach(a=>a.onclick=e=>{e.preventDefault();aiSec='people';VIEWS.ai().then(()=>AI.card($('#aibox'),a.dataset.mo))})};
 sx.innerHTML=`<div class="card"><h2>Поиск по памяти</h2><div class="row"><input id="mq" placeholder="Текст: «арена», имя, «гильдия»…"><select id="mk"><option value="">Все виды</option>${Object.entries(kinds).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select><button class="primary" id="mgo">Искать</button></div>
 <table style="margin-top:8px"><tr><th>ИИ</th><th>Вид</th><th>Воспоминание</th><th>Важность</th><th>Когда</th><th></th></tr><tbody id="mres"></tbody></table></div>`;
 $('#mgo').onclick=run;$('#mq').onkeydown=e=>{if(e.key==='Enter')run()};run()},

async schedules(box){const d=await api('/ai/schedules');const DAYS=['пн','вт','ср','чт','пт','сб','вс'];
 box.innerHTML=`<div class="card"><h2>Расписания ИИ</h2><p class="small muted">Время — московское (с учётом сдвига пояса каждого ИИ). Часы и дни через запятую: часы 0–23, дни 0=пн … 6=вс. «Вес» — какая доля новых ИИ получит профиль.</p>
 <table><tr><th>Профиль</th><th>Часы игры</th><th>Пиковые часы</th><th>Сдвиг пояса</th><th>Сессия, мин</th><th>Дни отдыха</th><th>Вес</th><th>ИИ</th><th></th></tr>
 ${d.items.map(p=>`<tr data-sc="${esc(p.code)}"><td><input data-f="name" value="${esc(p.name)}"><div class="small muted">${esc(p.code)}</div></td><td><input data-f="hours" value="${p.hours.join(',')}"></td><td><input data-f="peak_hours" value="${p.peak_hours.join(',')}"></td>
  <td><input data-f="tz_shift" type="number" value="${p.tz_shift}" style="width:70px"></td><td><input data-f="session_minutes" type="number" value="${p.session_minutes}" style="width:80px"></td>
  <td><input data-f="rest_weekdays" value="${p.rest_weekdays.join(',')}" title="${p.rest_weekdays.map(x=>DAYS[x]).join(', ')}"></td><td><input data-f="weight" type="number" value="${p.weight}" style="width:70px"></td><td>${p.personas}</td><td><button class="small primary" data-scs="${esc(p.code)}">Сохранить</button></td></tr>`).join('')}</table></div>`;
 const nums=v=>v.split(',').map(x=>x.trim()).filter(x=>x!=='').map(Number);
 box.querySelectorAll('[data-scs]').forEach(b=>b.onclick=async()=>{const tr=box.querySelector(`tr[data-sc="${b.dataset.scs}"]`);const f=n=>tr.querySelector(`[data-f="${n}"]`).value;
  await api('/ai/schedules/'+b.dataset.scs,'PUT',{name:f('name'),hours:nums(f('hours')),peak_hours:nums(f('peak_hours')),tz_shift:+f('tz_shift'),session_minutes:+f('session_minutes'),rest_weekdays:nums(f('rest_weekdays')),weight:+f('weight')});toast('Расписание сохранено');AI.schedules(box)})},

async tasks(box,stf){stf=stf??'';const d=await api('/ai/tasks?limit=100'+(stf?'&status='+stf:''));
 box.innerHTML=`<div class="card"><h2>Очередь задач Director</h2><div class="row"><select id="aitst"><option value="">Все</option>${Object.entries(AI_TASK).map(([k,t])=>`<option value="${k}" ${k===stf?'selected':''}>${t} (${d.counts[k]||0})</option>`).join('')}</select><button id="aitref">Обновить</button></div>
 <table style="margin-top:8px"><tr><th>#</th><th>Задача</th><th>Статус</th><th>Попытки</th><th>Создана</th><th>Итог</th><th></th></tr>
 ${d.items.map(t=>`<tr><td class="small">${t.id}</td><td class="small">${esc(AI_KIND(t.kind))}<div class="muted">приоритет ${t.priority}</div></td><td class="small">${t.status==='failed'?'<span class="bad">ошибка</span>':esc(AI_TASK[t.status]||t.status)}</td>
  <td class="small">${t.attempts} / ${t.max_attempts}</td><td class="small">${ago(t.created_at)}</td><td class="small muted" style="max-width:320px;overflow:hidden">${esc(t.error||(t.result?JSON.stringify(t.result):''))}</td>
  <td>${['failed','cancelled'].includes(t.status)?`<button class="small" data-retry="${t.id}">Повторить</button>`:''}</td></tr>`).join('')||'<tr><td class="muted">Пусто</td></tr>'}</table>
 <p class="small muted">Выполненные задачи через ${'сутки'} переносятся в историю. Повтор задачи никогда не дублирует награды и действия.</p></div>`;
 $('#aitst').onchange=()=>AI.tasks(box,$('#aitst').value);$('#aitref').onclick=()=>AI.tasks(box,$('#aitst').value);
 box.querySelectorAll('[data-retry]').forEach(b=>b.onclick=async()=>{await api('/ai/tasks/'+b.dataset.retry+'/retry','POST',{});toast('Задача снова в очереди');AI.tasks(box,$('#aitst').value)})},

async activity(box){const d=await api('/ai/activity?limit=100');
 box.innerHTML=`<div class="card"><h2>Что делали ИИ</h2><div class="row"><button id="aiaref">Обновить</button></div><table style="margin-top:8px"><tr><th>Когда</th><th>ИИ</th><th>Действие</th><th>Подробности</th></tr>
 ${d.items.map(a=>`<tr><td class="small">${ago(a.at)}</td><td><b>${esc(a.nickname)}</b> <span class="tag">ИИ</span></td><td class="small">${esc(a.activity)}</td><td class="small muted" style="max-width:420px;overflow:hidden">${esc(JSON.stringify(a.payload||{}))}</td></tr>`).join('')||'<tr><td class="muted">Пока пусто</td></tr>'}</table></div>`;
 $('#aiaref').onclick=()=>AI.activity(box)}
};
async function findPlayer(id){if(!id)return;const d=await api('/social/players/'+encodeURIComponent(id));const c=d.card;
 $('#pres').innerHTML=`<h3>${esc(c.nickname)} ${c.is_ai?'<span class="tag">ИИ</span>':''}</h3><div class="small">${c.uralia_id} · ур. ${c.level} · сила ${fmt(c.power)} · ${esc(c.presence)} ${c.guild?'· гильдия '+esc(c.guild.name):''}</div>
 <div class="small muted">Жалоб на игрока: ${d.reports_against}</div>
 <h3>Санкция</h3><div class="row"><select id="sk"><option value="warning">Предупреждение</option><option value="mute">Мут чата</option><option value="temp_ban">Временная блокировка</option><option value="perm_ban">Бессрочная блокировка</option></select>
 <input id="sm" type="number" placeholder="минут (для мута/временной)"><input id="sr" placeholder="Причина"><button class="danger" id="sgo">Выдать</button></div>
 <h3>Добавить VIP-опыт</h3><div class="row"><input id="vl" type="number" placeholder="VIP1 = 100, VIP3 = 1500, VIP5 = 10000, VIP7 = 60000"><button id="vgo">Добавить</button></div>
 <h3>История санкций</h3>${d.sanctions.map(s=>`<div class="small">${esc(s.kind_name)} · ${esc(s.reason)} · ${s.status} ${s.status==='active'?`<button class="small" data-rv="${s.id}">Снять</button>`:''}</div>`).join('')||'<p class="muted small">Нет</p>'}
 <h3>Последние сообщения</h3>${d.recent_messages.map(m=>`<div class="small">${esc(m.text)} ${m.hidden?'<span class="tag r">скрыто</span>':''}</div>`).join('')||'<p class="muted small">Нет</p>'}`;
 $('#sgo').onclick=async()=>{await api('/social/sanctions','POST',{uralia_id:c.uralia_id,kind:$('#sk').value,reason:$('#sr').value||'Нарушение правил',minutes:$('#sm').value?+$('#sm').value:null});toast('Санкция выдана');findPlayer(id)};
 $('#vgo').onclick=async()=>{const r=await api('/vip','POST',{uralia_id:c.uralia_id,delta_xp:+$('#vl').value});toast('Теперь VIP '+r.vip_level)};
 document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=async()=>{await api('/social/sanctions/'+b.dataset.rv+'/revoke','POST',{});findPlayer(id)})}
try{if(!sessionStorage.getItem('tok')&&localStorage.getItem('tok')){sessionStorage.setItem('tok',localStorage.getItem('tok'));sessionStorage.setItem('who',localStorage.getItem('who')||'owner')}}catch(e){}
if(sessionStorage.getItem('tok'))api('/web/overview').then(start).catch(login);else login();
</script>
</body>
</html>
