name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Export debug Android APK
        working-directory: client
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP" ../build
          # Godot's usual debug key. A fresh file each run does not match the
          # keystore created on the machine that built 0.7.8.
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --version
          godot --headless --path . --import --quit
          godot --headless --path . --export-debug "Android" ../build/uralia-debug.apk
          test -s ../build/uralia-debug.apk
          ls -lh ../build/uralia-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: uralia-debug-apk
          path: build/uralia-debug.apk
          if-no-files-found: error
          retention-days: 14
